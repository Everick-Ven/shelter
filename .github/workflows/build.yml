name: Build

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  workflow_dispatch:
# NOTE: no `pull_request` trigger on purpose — with both `push` and
# `pull_request` every push to a PR branch built twice (push + synchronize).
# Push builds already report commit checks on same-repo PRs, so one run is enough.

permissions:
  contents: read

env:
  CEF_VERSION_KEY: cef-154.0.32

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Windows window-control regression test
        shell: pwsh
        run: node tests/ui_window_controls_test.js

      - name: Cache CEF
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/cef
          key: ${{ env.CEF_VERSION_KEY }}-windows64-${{ hashFiles('CMakeLists.txt') }}

      - name: MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          beta_build=ON
          if [[ "${GITHUB_REF_TYPE:-branch}" == "tag" ]]; then beta_build=OFF; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHELTER_BETA_BUILD="$beta_build" -DSHELTER_CI_HOOKS=OFF -DUSE_SANDBOX=ON -DUSE_ATL=OFF 2>&1 | tee configure.log
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHELTER_BETA_BUILD="$beta_build" -DSHELTER_CI_HOOKS=ON -DUSE_SANDBOX=ON -DUSE_ATL=OFF 2>&1 | tee configure-ci.log

      - name: Verify CEF sandbox configuration
        shell: pwsh
        run: |
          python tools/check_sandbox_config.py configure.log windows
          if ($LASTEXITCODE -ne 0) { throw "Release sandbox configuration failed" }
          python tools/check_sandbox_config.py configure-ci.log windows
          if ($LASTEXITCODE -ne 0) { throw "CI-hook sandbox configuration failed" }

      - name: Build release and CI-hook variants
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target Shelter --parallel 2 2>&1 | tee build.log
          cmake --build build-ci --target Shelter --parallel 2 2>&1 | tee build-ci.log
          python tools/check_ci_hooks.py build off
          python tools/check_ci_hooks.py build-ci on

      - name: Verify real CRX3 signatures with BCrypt/CNG
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "cryptography>=43" 2>&1 | Tee-Object -FilePath fixture-setup.log
          if ($LASTEXITCODE -ne 0) { throw "cryptography install failed" }
          python tools/gen_crx3_fixtures.py --check 2>&1 | Tee-Object -FilePath crx3-fixtures.log
          if ($LASTEXITCODE -ne 0) { throw "CRX3 fixtures are stale or non-deterministic" }
          cmake --build build --target ShelterCrx3VerifyTest --parallel 2 2>&1 | Tee-Object -FilePath crx3-test-build.log
          if ($LASTEXITCODE -ne 0) { throw "CRX3 platform verifier test build failed" }
          cmake --build build --target ShelterDownloadRevealPathTest ShelterUtf8PathTest --parallel 2 2>&1 | Tee-Object -FilePath reveal-test-build.log
          if ($LASTEXITCODE -ne 0) { throw "Windows filesystem path test build failed" }
          ctest --test-dir build -C Release -R "crx3-platform-signature-verification|shelter-download-reveal-path|shelter-utf8-filesystem-path" --output-on-failure 2>&1 | Tee-Object -FilePath platform-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Windows CRX3 or filesystem path tests failed" }

      - name: Verify sandbox bootstrap files
        shell: pwsh
        run: |
          if (-not (Test-Path build/Release/Shelter.exe) -or -not (Test-Path build/Release/Shelter.dll)) {
            throw "CEF sandbox build must contain bootstrap Shelter.exe and client Shelter.dll"
          }
          $version = (Get-Content build/shelter-version.txt -Raw).Trim()
          $expected = '^' + [regex]::Escape($version) + '(\.0)?$'
          foreach ($path in @('build/Release/Shelter.exe', 'build/Release/Shelter.dll')) {
            $info = (Get-Item $path).VersionInfo
            if ($info.FileVersion -notmatch $expected -or $info.ProductVersion -notmatch $expected) {
              throw "$path version resource mismatch: file=$($info.FileVersion), product=$($info.ProductVersion), expected=$version"
            }
          }

      - name: Configure Windows crash dumps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dumpDir = Join-Path $env:RUNNER_TEMP "shelter-crash-dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $werKey = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\Shelter.exe"
          New-Item -Path $werKey -Force | Out-Null
          New-ItemProperty -Path $werKey -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $werKey -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $werKey -Name DumpCount -PropertyType DWord -Value 4 -Force | Out-Null
          "SHELTER_WER_DUMP_DIR=$dumpDir" >> $env:GITHUB_ENV
          "SHELTER_ACCEPTANCE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

      - name: Geometry and DevTools acceptance (CI hooks)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check websocket-client
          python tools/check_geometry.py build-ci/Release/Shelter.exe 2>&1 | tee geometry.log

      - name: CI-hook runtime acceptance
        timeout-minutes: 10
        shell: pwsh
        run: |
          $version = (Get-Content build-ci/shelter-version.txt -Raw).Trim()
          $env:PYTHONIOENCODING = "utf-8"
          python tools/acceptance_smoke.py "$PWD\build-ci\Release\Shelter.exe" --expected-version $version 2>&1 | Tee-Object -FilePath acceptance-ci.log
          if ($LASTEXITCODE -ne 0) { throw "CI-hook Windows runtime acceptance failed" }

      - name: Collect Windows crash dumps
        if: failure()
        shell: pwsh
        run: |
          python tools/collect_crash_reports.py --platform windows --source-dir $env:SHELTER_WER_DUMP_DIR --output-dir ci-crash-reports/windows --since-epoch $env:SHELTER_ACCEPTANCE_STARTED_AT
          if ($LASTEXITCODE -ne 0) { throw "Windows crash dump collection failed" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Get-Content build/shelter-version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid configured SHELTER_VERSION: $version" }
          Set-Content -Path dist/shelter-version.txt -Value $version -NoNewline -Encoding ascii
          & $iscc "/DSourceDir=$PWD\build\Release" "/DAppVersion=$version" installer\shelter.iss 2>&1 | Tee-Object -FilePath package.log
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }
          Get-ChildItem dist | Out-String | Tee-Object -FilePath package.log -Append

      - name: Install and test from a Cyrillic path, then uninstall
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check websocket-client
          if ($LASTEXITCODE -ne 0) { throw "websocket-client install failed" }
          $setup = "$PWD\dist\SHELTER-Setup-x64.exe"
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Проверка-SHELTER"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/LOG=$PWD\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with status $($p.ExitCode)" }
          $exe = Join-Path $dir "Shelter.exe"
          if (-not (Test-Path $exe)) { throw "Installed SHELTER executable not found: $exe" }
          python tools/check_ci_hooks.py "$dir" off --binary-only
          if ($LASTEXITCODE -ne 0) { throw "Installed release contains CI-only hooks" }
          Get-Process Shelter -ErrorAction SilentlyContinue | Stop-Process -Force
          $profile = Join-Path $env:LOCALAPPDATA "SHELTER"
          if (Test-Path $profile) { Remove-Item -LiteralPath $profile -Recurse -Force }
          "installed executable: $exe" | Tee-Object -FilePath smoke-run.log
          $env:PYTHONIOENCODING = "utf-8"
          $version = (Get-Content build/shelter-version.txt -Raw).Trim()
          python tools/acceptance_smoke.py $exe --expected-version $version --allow-missing-ci-hooks 2>&1 | Tee-Object -FilePath smoke-run.log -Append
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows runtime acceptance failed" }
          Get-Process Shelter -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $uninstaller = Join-Path $dir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found: $uninstaller" }
          $u = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller exited with status $($u.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "SHELTER executable remains after uninstall: $exe" }

      - name: Report Windows failure diagnostics
        if: failure()
        shell: pwsh
        run: python tools/report_ci_failure.py configure.log configure-ci.log build.log build-ci.log fixture-setup.log crx3-fixtures.log crx3-test-build.log reveal-test-build.log platform-tests.log package.log install.log geometry.log geometry-app.log acceptance-ci.log smoke-run.log acceptance-app.log ci-crash-reports/windows

      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item -Recurse build/Release dist/SHELTER
          Remove-Item -Force -ErrorAction SilentlyContinue dist/SHELTER/*.pdb, dist/SHELTER/*.lib, dist/SHELTER/*.exp
          Compress-Archive -Path dist/SHELTER -DestinationPath dist/SHELTER-windows-x64-portable.zip
          Remove-Item -Recurse -Force dist/SHELTER
          $portableCheck = Join-Path $PWD "portable-check"
          Expand-Archive -Path dist/SHELTER-windows-x64-portable.zip -DestinationPath $portableCheck
          python tools/check_ci_hooks.py "$portableCheck" off --binary-only
          if ($LASTEXITCODE -ne 0) { throw "Portable ZIP contains CI-only hooks" }
          Remove-Item -Recurse -Force $portableCheck

      - name: Create package checksums
        shell: pwsh
        run: |
          $files = @("dist/SHELTER-Setup-x64.exe", "dist/SHELTER-windows-x64-portable.zip")
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHELTER-windows-x64
          path: |
            dist/SHELTER-Setup-x64.exe
            dist/SHELTER-windows-x64-portable.zip
            dist/SHA256SUMS.txt
            dist/shelter-version.txt
          if-no-files-found: error

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHELTER-windows-ci-logs
          path: |
            configure.log
            configure-ci.log
            build.log
            build-ci.log
            fixture-setup.log
            crx3-fixtures.log
            crx3-test-build.log
            reveal-test-build.log
            platform-tests.log
            package.log
            install.log
            geometry.log
            geometry-app.log
            ci-crash-reports/windows/**
            acceptance-ci.log
            smoke-run.log
            acceptance-app.log
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: macOS Intel (x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache CEF
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/cef
          key: ${{ env.CEF_VERSION_KEY }}-macosx64-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          set -euo pipefail
          beta_build=ON
          if [[ "${GITHUB_REF_TYPE:-branch}" == "tag" ]]; then beta_build=OFF; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHELTER_BETA_BUILD="$beta_build" -DSHELTER_CI_HOOKS=OFF -DPROJECT_ARCH=x86_64 -DCMAKE_OSX_ARCHITECTURES=x86_64 -DUSE_SANDBOX=ON 2>&1 | tee configure.log
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHELTER_BETA_BUILD="$beta_build" -DSHELTER_CI_HOOKS=ON -DPROJECT_ARCH=x86_64 -DCMAKE_OSX_ARCHITECTURES=x86_64 -DUSE_SANDBOX=ON 2>&1 | tee configure-ci.log

      - name: Verify CEF sandbox configuration
        run: |
          python3 tools/check_sandbox_config.py configure.log macos
          python3 tools/check_sandbox_config.py configure-ci.log macos

      - name: Build release and CI-hook variants
        run: |
          set -euo pipefail
          cmake --build build --target Shelter --parallel 2 2>&1 | tee build.log
          cmake --build build-ci --target Shelter --parallel 2 2>&1 | tee build-ci.log
          python3 tools/check_ci_hooks.py build off
          python3 tools/check_ci_hooks.py build-ci on

      - name: Verify real CRX3 signatures with Security.framework
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check 'cryptography>=43' 2>&1 | tee fixture-setup.log
          python tools/gen_crx3_fixtures.py --check 2>&1 | tee crx3-fixtures.log
          cmake --build build --target ShelterCrx3VerifyTest --parallel 2 2>&1 | tee crx3-test-build.log
          cmake --build build --target ShelterDownloadRevealPathTest ShelterUtf8PathTest --parallel 2 2>&1 | tee reveal-test-build.log
          ctest --test-dir build -C Release -R "crx3-platform-signature-verification|shelter-download-reveal-path|shelter-utf8-filesystem-path" --output-on-failure 2>&1 | tee platform-tests.log

      - name: Verify macOS sandbox library
        run: |
          test -f "build/Release/SHELTER.app/Contents/Frameworks/Chromium Embedded Framework.framework/Libraries/libcef_sandbox.dylib"
          test -f "build-ci/Release/SHELTER.app/Contents/Frameworks/Chromium Embedded Framework.framework/Libraries/libcef_sandbox.dylib"

      - name: Prepare isolated keychain for macOS acceptance
        run: |
          set -euo pipefail
          ci_keychain="$HOME/Library/Keychains/SHELTER-CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          ci_keychain_password="$(uuidgen)"
          security create-keychain -p "$ci_keychain_password" "$ci_keychain"
          security set-keychain-settings -lut 21600 "$ci_keychain"
          security unlock-keychain -p "$ci_keychain_password" "$ci_keychain"
          security list-keychains -d user -s "$ci_keychain"
          security default-keychain -d user -s "$ci_keychain"

      - name: Mark macOS native acceptance start
        run: echo "SHELTER_ACCEPTANCE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Geometry and DevTools acceptance (CI hooks)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check websocket-client
          python tools/check_geometry.py build-ci/Release/SHELTER.app/Contents/MacOS/Shelter 2>&1 | tee geometry.log

      - name: CI-hook runtime acceptance
        timeout-minutes: 12
        run: |
          set -euo pipefail
          . .venv/bin/activate
          version="$(tr -d '\r\n' < build-ci/shelter-version.txt)"
          acceptance_ok=0
          for attempt in 1 2 3; do
            echo "Acceptance attempt $attempt"
            if python tools/acceptance_smoke.py build-ci/Release/SHELTER.app/Contents/MacOS/Shelter --expected-version "$version" 2>&1 | tee acceptance-ci.log; then
              acceptance_ok=1
              break
            fi
            echo "Acceptance attempt $attempt failed; retrying in 30 seconds" >&2
            sleep 30
          done
          [[ "$acceptance_ok" == 1 ]]

      - name: Collect macOS crash reports
        if: failure()
        run: |
          set -euo pipefail
          python3 tools/collect_crash_reports.py --platform macos \
            --source-dir "$HOME/Library/Logs/DiagnosticReports" \
            --source-dir "/Library/Logs/DiagnosticReports" \
            --output-dir ci-crash-reports/macos \
            --since-epoch "${SHELTER_ACCEPTANCE_STARTED_AT:-0}"

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(tr -d '\r\n' < build/shelter-version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          dmg_name="SHELTER-macos-x64-${version}.dmg"
          printf '%s' "$version" > dist/shelter-version.txt
          tools/make_dmg.sh build/Release/SHELTER.app "dist/$dmg_name" "$version" 2>&1 | tee package.log
          (cd dist && shasum -a 256 "$dmg_name" > SHA256SUMS.txt)

      - name: Install and test packaged DMG from a Cyrillic path (strict)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          exec > >(tee -a packaged-dmg-acceptance.log) 2>&1
          trap 'status=$?; echo "Packaged DMG acceptance failed at line ${LINENO} (exit ${status})"; exit "$status"' ERR
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check websocket-client
          mount_point="$(mktemp -d "${TMPDIR:-/tmp}/shelter-dmg.XXXXXX")"
          cleanup() {
            if [[ -n "$mount_point" ]]; then
              hdiutil detach "$mount_point" -quiet 2>/dev/null || true
              rmdir "$mount_point" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          version="$(tr -d '\r\n' < build/shelter-version.txt)"
          dmg_name="SHELTER-macos-x64-${version}.dmg"
          hdiutil attach "dist/$dmg_name" -nobrowse -mountpoint "$mount_point"
          test -d "$mount_point/SHELTER.app"
          app_dir="$HOME/Applications/Проверка-SHELTER.app"
          mkdir -p "$HOME/Applications"
          rm -rf "$app_dir"
          cp -R "$mount_point/SHELTER.app" "$app_dir"
          hdiutil detach "$mount_point" -quiet
          rmdir "$mount_point"
          mount_point=""
          ls -la "$app_dir/Contents/Resources"
          python tools/check_ci_hooks.py "$app_dir" off --binary-only
          pkill -x Shelter 2>/dev/null || true
          rm -rf "$HOME/Library/Application Support/SHELTER"
          # Изолированная связка CI не должна переиспользовать ключ сборки до упаковки.
          ci_keychain="$HOME/Library/Keychains/SHELTER-CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          if security find-generic-password -a master-key -s SHELTER "$ci_keychain" >/dev/null 2>&1; then
            security delete-generic-password -a master-key -s SHELTER "$ci_keychain"
          fi
          acceptance_ok=0
          for attempt in 1 2 3; do
            echo "Packaged acceptance attempt $attempt"
            if python tools/acceptance_smoke.py "$app_dir/Contents/MacOS/Shelter" --expected-version "$version" --allow-missing-ci-hooks 2>&1 | tee smoke-run.log; then
              acceptance_ok=1
              break
            fi
            echo "Packaged acceptance attempt $attempt failed; retrying in 30 seconds" >&2
            sleep 30
          done
          [[ "$acceptance_ok" == 1 ]]

      - name: Inspect macOS master-key mirror
        if: always()
        run: |
          key_file="$HOME/Library/Application Support/SHELTER/secret.key"
          if [[ -f "$key_file" ]]; then
            echo "SHELTER_KEY_MIRROR exists mode=$(stat -f '%Lp' "$key_file") size=$(stat -f '%z' "$key_file")"
          else
            echo "SHELTER_KEY_MIRROR missing"
          fi

      - name: Verify macOS master-key mirror
        run: |
          set -euo pipefail
          key_file="$HOME/Library/Application Support/SHELTER/secret.key"
          test -f "$key_file"
          key_mode="$(stat -f '%Lp' "$key_file")"
          [[ "$key_mode" == "600" ]] || {
            echo "Expected master-key mirror mode 600; found $key_mode" >&2
            exit 1
          }

      - name: Report macOS failure diagnostics
        if: failure()
        run: python3 tools/report_ci_failure.py configure.log configure-ci.log build.log build-ci.log fixture-setup.log crx3-fixtures.log crx3-test-build.log reveal-test-build.log platform-tests.log package.log packaged-dmg-acceptance.log geometry.log geometry-app.log acceptance-ci.log smoke-run.log acceptance-app.log ci-crash-reports/macos

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHELTER-macos-x64
          path: |
            dist/SHELTER-macos-x64-*.dmg
            dist/SHA256SUMS.txt
            dist/shelter-version.txt
          if-no-files-found: error

      - name: Upload macOS diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHELTER-macos-ci-logs
          path: |
            configure.log
            configure-ci.log
            build.log
            build-ci.log
            fixture-setup.log
            crx3-fixtures.log
            crx3-test-build.log
            reveal-test-build.log
            platform-tests.log
            package.log
            packaged-dmg-acceptance.log
            geometry.log
            geometry-app.log
            ci-crash-reports/macos/**
            acceptance-ci.log
            smoke-run.log
            acceptance-app.log
          if-no-files-found: ignore
          retention-days: 14

  security-unit:
    name: UI and security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: CI crash diagnostic collection tests
        run: python3 tests/ci_crash_diagnostics_test.py && python3 tests/ci_crash_report_summary_test.py
      - name: DevTools UI and bridge regression tests
        run: node tests/ui_devtools_test.js && node tests/devtools_bridge_reentrancy_test.js && node tests/devtools_client_test.js && node tests/devtools_dock_test.js
      - name: Download UI regression test
        run: node tests/download_ui_test.js
      - name: Tracker/ad statistics regression test
        run: node tests/blocked_stats_test.js
      - name: UI stylesheet integrity test
        run: node tests/ui_css_test.js
      - name: Settings panel and toolbar regression test
        run: node tests/ui_settings_test.js
      - name: Tab strip and pinned tab regression test
        run: node tests/ui_tabs_test.js
      - name: Extensions page and bridge regression test
        run: node tests/ui_extensions_test.js
      - name: CRX3 installation security regression test
        run: node tests/crx3_install_test.js
      - name: Popup security regression test
        run: node tests/popup_client_security_test.js
      - name: Show-in-folder path security regression test
        run: node tests/show_in_folder_security_test.js
      - name: OpenExternal dead-code removal test
        run: node tests/open_external_removal_test.js
      - name: NavUrl scheme security regression test
        run: node tests/nav_url_security_test.js
      - name: CI-only hook configuration regression test
        run: node tests/ci_hooks_test.js
      - name: Compile and run CRX3 format tests
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -I. tests/crx3_format_test.cc -o crx3-format-test
          ./crx3-format-test
      - name: Task planner and migration regression test

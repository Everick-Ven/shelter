name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Bootstrap CEF
        shell: bash
        run: CEF_PLATFORM=windows ./scripts/bootstrap-cef.sh
      - name: Build and test
        shell: bash
        run: |
          bash scripts/ci-command.sh configure cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          bash scripts/ci-command.sh build cmake --build build
          bash scripts/ci-command.sh test ctest --test-dir build --output-on-failure
      - name: Package Windows portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\Resources | Out-Null
          Copy-Item build\shelter.exe package\
          Copy-Item resources\ui package\Resources\ui -Recurse
          Copy-Item resources\icons\icon-256.png package\SHELTER.png
          Copy-Item cef\Release\* package\ -Recurse -Force
          Copy-Item cef\Resources\* package\Resources\ -Recurse -Force
          Compress-Archive -Path package\* -DestinationPath SHELTER-windows-x64-portable.zip -Force
      - uses: actions/upload-artifact@v4
        with: { name: SHELTER-windows-x64, path: SHELTER-windows-x64-portable.zip }
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap CEF
        run: CEF_PLATFORM=macos ./scripts/bootstrap-cef.sh
      - name: Build and test
        run: |
          bash scripts/ci-command.sh configure cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          bash scripts/ci-command.sh build cmake --build build
          bash scripts/ci-command.sh test ctest --test-dir build --output-on-failure
      - name: Package macOS app
        run: |
          mkdir -p package/SHELTER.app/Contents/MacOS package/SHELTER.app/Contents/Resources package/SHELTER.app/Contents/Frameworks
          cp -R build/shelter.app/Contents/MacOS/shelter package/SHELTER.app/Contents/MacOS/
          cp mac/Info.plist package/SHELTER.app/Contents/Info.plist
          cp -R resources/ui package/SHELTER.app/Contents/Resources/ui
          cp resources/icons/icon-1024.png package/SHELTER.app/Contents/Resources/SHELTER.png
          mkdir -p /tmp/SHELTER.iconset
          sips -z 16 16 resources/icons/icon-256.png --out /tmp/SHELTER.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 resources/icons/icon-256.png --out /tmp/SHELTER.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 resources/icons/icon-256.png --out /tmp/SHELTER.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 resources/icons/icon-256.png --out /tmp/SHELTER.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 resources/icons/icon-256.png --out /tmp/SHELTER.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 resources/icons/icon-256.png --out /tmp/SHELTER.iconset/icon_128x128@2x.png >/dev/null
          iconutil -c icns /tmp/SHELTER.iconset -o package/SHELTER.app/Contents/Resources/SHELTER.icns
          cp -R "cef/Release/Chromium Embedded Framework.framework" package/SHELTER.app/Contents/Frameworks/
          mkdir -p "package/SHELTER.app/Contents/Frameworks/SHELTER Helper.app/Contents/MacOS"
          cp build/shelter.app/Contents/MacOS/shelter "package/SHELTER.app/Contents/Frameworks/SHELTER Helper.app/Contents/MacOS/SHELTER Helper"
          cp mac/Helper-Info.plist "package/SHELTER.app/Contents/Frameworks/SHELTER Helper.app/Contents/Info.plist"
          mkdir -p dmg-root
          cp -R package/SHELTER.app dmg-root/SHELTER.app
          ln -s /Applications dmg-root/Applications
          rm -f SHELTER-macos-x64.dmg
          hdiutil detach "$(hdiutil info | awk '/dmg-root/{print $1; exit}')" 2>/dev/null || true
          hdiutil create -volname SHELTER -srcfolder "${GITHUB_WORKSPACE}/dmg-root" -ov -format UDZO "${GITHUB_WORKSPACE}/SHELTER-macos-x64.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: SHELTER-macos-x64, path: SHELTER-macos-x64.dmg }

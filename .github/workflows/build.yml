  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Everick-Ven/shelter'
    needs: [windows, macos, security-unit]
    runs-on: ubuntu-24.04
    environment:
      name: release-signing
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
      - name: Generate release SHA-256 checksums
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < assets/SHELTER-windows-x64/shelter-version.txt)"
          mac_version="$(tr -d '\r\n' < assets/SHELTER-macos-x64/shelter-version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version" == "$mac_version" ]]
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match configured SHELTER_VERSION $version" >&2
            exit 1
          fi
          dmg="SHELTER-macos-x64-${version}.dmg"
          files=(
            "assets/SHELTER-windows-x64/SHELTER-Setup-x64.exe"
            "assets/SHELTER-windows-x64/SHELTER-windows-x64-portable.zip"
            "assets/SHELTER-macos-x64/$dmg"
          )
          : > assets/SHA256SUMS.txt
          for file in "${files[@]}"; do
            test -f "$file"
            hash="$(sha256sum "$file" | cut -d ' ' -f1)"
            echo "$hash  ${file##*/}" >> assets/SHA256SUMS.txt
          done
          echo "SHELTER_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install pinned minisign 0.12 from verified source
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libsodium-dev
          archive="$RUNNER_TEMP/minisign-0.12.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://codeload.github.com/jedisct1/minisign/tar.gz/refs/tags/0.12
          echo "796dce1376f9bcb1a19ece729c075c47054364355fe0c0c1ebe5104d508c7db0  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/minisign-src"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/minisign-src"
          cmake -S "$RUNNER_TEMP/minisign-src" -B "$RUNNER_TEMP/minisign-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/minisign-install"
          cmake --build "$RUNNER_TEMP/minisign-build" --parallel 2
          cmake --install "$RUNNER_TEMP/minisign-build"
          echo "$RUNNER_TEMP/minisign-install/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/minisign-install/bin/minisign" -v
      - name: Sign and verify release manifest with minisign
        env:
          RELEASE_MINISIGN_SECRET_KEY_BASE64: ${{ secrets.RELEASE_MINISIGN_SECRET_KEY_BASE64 }}
          RELEASE_MINISIGN_PASSWORD: ${{ secrets.RELEASE_MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/shelter-release.key"
          trap 'rm -f "$key_file"' EXIT
          if grep -q '^# OWNER ACTION REQUIRED' docs/release-pubkey.txt; then
            echo "No release public key has been published; release signing is disabled until the owner completes docs/release-key.md" >&2
            exit 1
          fi
          : "${RELEASE_MINISIGN_SECRET_KEY_BASE64:?Configure this secret in the protected release-signing Environment}"
          : "${RELEASE_MINISIGN_PASSWORD:?Configure this secret in the protected release-signing Environment}"
          umask 077
          rm -f "$key_file"
          printf '%s' "$RELEASE_MINISIGN_SECRET_KEY_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          test -s "$key_file"
          printf '%s\n' "$RELEASE_MINISIGN_PASSWORD" | minisign -S -s "$key_file" \
            -m assets/SHA256SUMS.txt -x assets/SHA256SUMS.txt.minisig
          minisign -V -p docs/release-pubkey.txt -m assets/SHA256SUMS.txt \
            -x assets/SHA256SUMS.txt.minisig
          fingerprint="$(python3 -c 'import base64,hashlib,pathlib; rows=pathlib.Path("docs/release-pubkey.txt").read_bytes().splitlines(); assert len(rows) >= 2 and rows[0].startswith(b"untrusted comment: minisign public key "); print(hashlib.sha256(base64.b64decode(rows[1], validate=True)).hexdigest())')"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          printf 'RELEASE_MINISIGN_FINGERPRINT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            assets/SHELTER-windows-x64/SHELTER-Setup-x64.exe
            assets/SHELTER-windows-x64/SHELTER-windows-x64-portable.zip
            assets/SHELTER-macos-x64/*.dmg
            assets/SHA256SUMS.txt
            assets/SHA256SUMS.txt.minisig
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find assets -type f | sort
          dmg="SHELTER-macos-x64-${SHELTER_VERSION}.dmg"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Пакеты SHELTER: SHELTER-Setup-x64.exe (Windows x64), ${dmg} (macOS Intel), portable ZIP для Windows.

          Проверка целостности:
          - Публичный ключ и отпечаток SHA-256: docs/release-pubkey.txt в репозитории.
          - Отпечаток ключа (SHA-256 от decoded minisign public-key record): ${RELEASE_MINISIGN_FINGERPRINT}
          - Проверить: minisign -V -p release-pubkey.txt -m SHA256SUMS.txt -x SHA256SUMS.txt.minisig
          - Затем сравнить SHA-256 скачанного файла с SHA256SUMS.txt.
          - Подтверждение происхождения: gh attestation verify <файл> -R Everick-Ven/shelter

          macOS: приложение ad-hoc подписано, Developer ID и нотаризации нет; Gatekeeper может показать предупреждение. Проверяйте подпись и SHA-256 до ручного разрешения запуска. Windows: Authenticode нет; SmartScreen может показать предупреждение. Проверяйте minisign и SHA-256 до ручного разрешения запуска.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SHELTER ${SHELTER_VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            assets/SHELTER-windows-x64/SHELTER-Setup-x64.exe \
            assets/SHELTER-windows-x64/SHELTER-windows-x64-portable.zip \
            "assets/SHELTER-macos-x64/${dmg}" \
            assets/SHA256SUMS.txt \
            assets/SHA256SUMS.txt.minisig

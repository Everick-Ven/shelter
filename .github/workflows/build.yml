name: Build

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CEF_VERSION_KEY: cef-154.0.32

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: write  # push failure logs to the ci-logs-windows branch
    steps:
      - uses: actions/checkout@v4

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: ${{ env.CEF_VERSION_KEY }}-windows64-${{ hashFiles('CMakeLists.txt') }}

      - name: MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_SANDBOX=ON -DUSE_ATL=OFF 2>&1 | tee configure.log

      - name: Verify CEF sandbox configuration
        shell: pwsh
        run: python tools/check_sandbox_config.py configure.log windows

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target Shelter --parallel 2 2>&1 | tee build.log

      - name: Verify sandbox bootstrap files
        shell: pwsh
        run: |
          if (-not (Test-Path build/Release/Shelter.exe) -or -not (Test-Path build/Release/Shelter.dll)) {
            throw "CEF sandbox build must contain bootstrap Shelter.exe and client Shelter.dll"
          }

      - name: Geometry acceptance (strict)
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_geometry.py build/Release/Shelter.exe 2>&1 | tee geometry.log

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден" }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DSourceDir=$PWD\build\Release" "/DAppVersion=1.0.165" installer\shelter.iss 2>&1 | Tee-Object -FilePath package.log
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }
          Get-ChildItem dist | Out-String | Tee-Object -FilePath package.log -Append

      - name: Install, packaged runtime acceptance, uninstall
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check websocket-client
          if ($LASTEXITCODE -ne 0) { throw "websocket-client install failed" }
          $setup = "$PWD\dist\SHELTER-Setup-x64.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$PWD\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with status $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\SHELTER"
          $exe = Join-Path $dir "Shelter.exe"
          if (-not (Test-Path $exe)) { throw "Installed SHELTER executable not found: $exe" }
          "installed executable: $exe" | Tee-Object -FilePath smoke-run.log
          $env:PYTHONIOENCODING = "utf-8"
          python tools/acceptance_smoke.py $exe 2>&1 | Tee-Object -FilePath smoke-run.log -Append
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows runtime acceptance failed" }
          Get-Process Shelter -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $uninstaller = Join-Path $dir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found: $uninstaller" }
          $u = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller exited with status $($u.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "SHELTER executable remains after uninstall: $exe" }

      - name: Report Windows failure diagnostics
        if: failure()
        shell: pwsh
        run: python tools/report_ci_failure.py configure.log build.log package.log install.log geometry.log geometry-app.log smoke-run.log acceptance-app.log

      - name: Push Windows logs to ci-logs branch
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/push_log.sh windows configure.log build.log package.log install.log geometry.log geometry-app.log smoke-run.log acceptance-app.log || true

      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item -Recurse build/Release dist/SHELTER
          Remove-Item -Force -ErrorAction SilentlyContinue dist/SHELTER/*.pdb, dist/SHELTER/*.lib, dist/SHELTER/*.exp
          Compress-Archive -Path dist/SHELTER -DestinationPath dist/SHELTER-windows-x64-portable.zip
          Remove-Item -Recurse -Force dist/SHELTER

      - name: Create package checksums
        shell: pwsh
        run: |
          $files = @("dist/SHELTER-Setup-x64.exe", "dist/SHELTER-windows-x64-portable.zip")
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: SHELTER-windows-x64
          path: |
            dist/SHELTER-Setup-x64.exe
            dist/SHELTER-windows-x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHELTER-windows-ci-logs
          path: |
            configure.log
            build.log
            package.log
            install.log
            geometry.log
            smoke-run.log
            acceptance-app.log
          if-no-files-found: ignore

  macos:
    name: macOS Intel (x86_64)
    runs-on: macos-15-intel
    permissions:
      contents: write  # push failure logs to the ci-logs-macos branch
    steps:
      - uses: actions/checkout@v4

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: ${{ env.CEF_VERSION_KEY }}-macosx64-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPROJECT_ARCH=x86_64 -DCMAKE_OSX_ARCHITECTURES=x86_64 -DUSE_SANDBOX=ON 2>&1 | tee configure.log

      - name: Verify CEF sandbox configuration
        run: python3 tools/check_sandbox_config.py configure.log macos

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build --target Shelter --parallel 2 2>&1 | tee build.log

      - name: Verify macOS sandbox library
        run: |
          test -f "build/Release/SHELTER.app/Contents/Frameworks/Chromium Embedded Framework.framework/Libraries/libcef_sandbox.dylib"

      - name: Geometry acceptance (strict)
        run: |
          set -euo pipefail
          python3 tools/check_geometry.py build/Release/SHELTER.app/Contents/MacOS/Shelter 2>&1 | tee geometry.log

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          tools/make_dmg.sh build/Release/SHELTER.app dist/SHELTER-macos-x64.dmg 1.0.165 2>&1 | tee package.log
          (cd dist && shasum -a 256 SHELTER-macos-x64.dmg > SHA256SUMS.txt)

      - name: Install and test packaged DMG (strict)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check websocket-client
          mount_point="$(mktemp -d "${TMPDIR:-/tmp}/shelter-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_point" -quiet 2>/dev/null || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach dist/SHELTER-macos-x64.dmg -nobrowse -mountpoint "$mount_point"
          test -d "$mount_point/SHELTER.app"
          rm -rf /Applications/SHELTER.app
          cp -R "$mount_point/SHELTER.app" /Applications/SHELTER.app
          hdiutil detach "$mount_point" -quiet
          rmdir "$mount_point"
          trap - EXIT
          ls -la /Applications/SHELTER.app/Contents/Resources
          python tools/acceptance_smoke.py /Applications/SHELTER.app/Contents/MacOS/Shelter 2>&1 | tee smoke-run.log

      - name: Report macOS failure diagnostics
        if: failure()
        run: python3 tools/report_ci_failure.py configure.log build.log package.log geometry.log geometry-app.log smoke-run.log acceptance-app.log

      - name: Push macOS logs to ci-logs branch
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/push_log.sh macos configure.log build.log package.log geometry.log geometry-app.log smoke-run.log acceptance-app.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: SHELTER-macos-x64
          path: |
            dist/SHELTER-macos-x64.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload macOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHELTER-macos-ci-logs
          path: |
            configure.log
            build.log
            package.log
            geometry.log
            smoke-run.log
            acceptance-app.log
          if-no-files-found: ignore

  security-unit:
    name: UI and security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download UI regression test
        run: node tests/download_ui_test.js
      - name: Tracker/ad statistics regression test
        run: node tests/blocked_stats_test.js
      - name: Compile and run path/archive safety tests
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -I. tests/security_paths_test.cc -o security-paths-test
          ./security-paths-test

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, security-unit]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Generate release SHA-256 checksums
        run: |
          set -euo pipefail
          cd assets
          files=(
            SHELTER-windows-x64/SHELTER-Setup-x64.exe
            SHELTER-windows-x64/SHELTER-windows-x64-portable.zip
            SHELTER-macos-x64/SHELTER-macos-x64.dmg
          )
          : > SHA256SUMS.txt
          for file in "${files[@]}"; do
            hash="$(sha256sum "$file" | cut -d ' ' -f1)"
            echo "$hash  ${file##*/}" >> SHA256SUMS.txt
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find assets -type f | sort
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SHELTER ${GITHUB_REF_NAME#v}" \
            --notes "Установщики: SHELTER-Setup-x64.exe (Windows x64), SHELTER-macos-x64.dmg (macOS Intel). Также portable zip для Windows. SHA256SUMS.txt содержит контрольные суммы. macOS: ad-hoc подпись без Developer ID и нотаризации; при первом запуске Gatekeeper может потребовать «Открыть»." \
            assets/SHELTER-windows-x64/SHELTER-Setup-x64.exe \
            assets/SHELTER-windows-x64/SHELTER-windows-x64-portable.zip \
            assets/SHELTER-macos-x64/SHELTER-macos-x64.dmg \
            assets/SHA256SUMS.txt

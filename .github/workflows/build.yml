name: Build

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CEF_VERSION_KEY: cef-154.0.32

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache CEF
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/cef
          key: ${{ env.CEF_VERSION_KEY }}-windows64-${{ hashFiles('CMakeLists.txt') }}

      - name: MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_SANDBOX=ON -DUSE_ATL=OFF 2>&1 | tee configure.log

      - name: Verify CEF sandbox configuration
        shell: pwsh
        run: python tools/check_sandbox_config.py configure.log windows

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target Shelter --parallel 2 2>&1 | tee build.log

      - name: Verify sandbox bootstrap files
        shell: pwsh
        run: |
          if (-not (Test-Path build/Release/Shelter.exe) -or -not (Test-Path build/Release/Shelter.dll)) {
            throw "CEF sandbox build must contain bootstrap Shelter.exe and client Shelter.dll"
          }
          $version = (Get-Content build/shelter-version.txt -Raw).Trim()
          $expected = '^' + [regex]::Escape($version) + '(\.0)?$'
          foreach ($path in @('build/Release/Shelter.exe', 'build/Release/Shelter.dll')) {
            $info = (Get-Item $path).VersionInfo
            if ($info.FileVersion -notmatch $expected -or $info.ProductVersion -notmatch $expected) {
              throw "$path version resource mismatch: file=$($info.FileVersion), product=$($info.ProductVersion), expected=$version"
            }
          }

      - name: Geometry acceptance (strict)
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_geometry.py build/Release/Shelter.exe 2>&1 | tee geometry.log

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Get-Content build/shelter-version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid configured SHELTER_VERSION: $version" }
          Set-Content -Path dist/shelter-version.txt -Value $version -NoNewline -Encoding ascii
          & $iscc "/DSourceDir=$PWD\build\Release" "/DAppVersion=$version" installer\shelter.iss 2>&1 | Tee-Object -FilePath package.log
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }
          Get-ChildItem dist | Out-String | Tee-Object -FilePath package.log -Append

      - name: Install, packaged runtime acceptance, uninstall
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check websocket-client
          if ($LASTEXITCODE -ne 0) { throw "websocket-client install failed" }
          $setup = "$PWD\dist\SHELTER-Setup-x64.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$PWD\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with status $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\SHELTER"
          $exe = Join-Path $dir "Shelter.exe"
          if (-not (Test-Path $exe)) { throw "Installed SHELTER executable not found: $exe" }
          "installed executable: $exe" | Tee-Object -FilePath smoke-run.log
          $env:PYTHONIOENCODING = "utf-8"
          $version = (Get-Content build/shelter-version.txt -Raw).Trim()
          python tools/acceptance_smoke.py $exe --expected-version $version 2>&1 | Tee-Object -FilePath smoke-run.log -Append
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows runtime acceptance failed" }
          Get-Process Shelter -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $uninstaller = Join-Path $dir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found: $uninstaller" }
          $u = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller exited with status $($u.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "SHELTER executable remains after uninstall: $exe" }

      - name: Report Windows failure diagnostics
        if: failure()
        shell: pwsh
        run: python tools/report_ci_failure.py configure.log build.log package.log install.log geometry.log geometry-app.log smoke-run.log acceptance-app.log

      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item -Recurse build/Release dist/SHELTER
          Remove-Item -Force -ErrorAction SilentlyContinue dist/SHELTER/*.pdb, dist/SHELTER/*.lib, dist/SHELTER/*.exp
          Compress-Archive -Path dist/SHELTER -DestinationPath dist/SHELTER-windows-x64-portable.zip
          Remove-Item -Recurse -Force dist/SHELTER

      - name: Create package checksums
        shell: pwsh
        run: |
          $files = @("dist/SHELTER-Setup-x64.exe", "dist/SHELTER-windows-x64-portable.zip")
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHELTER-windows-x64
          path: |
            dist/SHELTER-Setup-x64.exe
            dist/SHELTER-windows-x64-portable.zip
            dist/SHA256SUMS.txt
            dist/shelter-version.txt
          if-no-files-found: error

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHELTER-windows-ci-logs
          path: |
            configure.log
            build.log
            package.log
            install.log
            geometry.log
            smoke-run.log
            acceptance-app.log
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: macOS Intel (x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache CEF
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/cef
          key: ${{ env.CEF_VERSION_KEY }}-macosx64-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPROJECT_ARCH=x86_64 -DCMAKE_OSX_ARCHITECTURES=x86_64 -DUSE_SANDBOX=ON 2>&1 | tee configure.log

      - name: Verify CEF sandbox configuration
        run: python3 tools/check_sandbox_config.py configure.log macos

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build --target Shelter --parallel 2 2>&1 | tee build.log

      - name: Verify macOS sandbox library
        run: |
          test -f "build/Release/SHELTER.app/Contents/Frameworks/Chromium Embedded Framework.framework/Libraries/libcef_sandbox.dylib"

      - name: Geometry acceptance (strict)
        run: |
          set -euo pipefail
          python3 tools/check_geometry.py build/Release/SHELTER.app/Contents/MacOS/Shelter 2>&1 | tee geometry.log

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(tr -d '\r\n' < build/shelter-version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          dmg_name="SHELTER-macos-x64-${version}.dmg"
          printf '%s' "$version" > dist/shelter-version.txt
          tools/make_dmg.sh build/Release/SHELTER.app "dist/$dmg_name" "$version" 2>&1 | tee package.log
          (cd dist && shasum -a 256 "$dmg_name" > SHA256SUMS.txt)

      - name: Install and test packaged DMG (strict)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check websocket-client
          mount_point="$(mktemp -d "${TMPDIR:-/tmp}/shelter-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_point" -quiet 2>/dev/null || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup EXIT
          version="$(tr -d '\r\n' < build/shelter-version.txt)"
          dmg_name="SHELTER-macos-x64-${version}.dmg"
          hdiutil attach "dist/$dmg_name" -nobrowse -mountpoint "$mount_point"
          test -d "$mount_point/SHELTER.app"
          rm -rf /Applications/SHELTER.app
          cp -R "$mount_point/SHELTER.app" /Applications/SHELTER.app
          hdiutil detach "$mount_point" -quiet
          rmdir "$mount_point"
          trap - EXIT
          ls -la /Applications/SHELTER.app/Contents/Resources
          python tools/acceptance_smoke.py /Applications/SHELTER.app/Contents/MacOS/Shelter --expected-version "$version" 2>&1 | tee smoke-run.log

      - name: Report macOS failure diagnostics
        if: failure()
        run: python3 tools/report_ci_failure.py configure.log build.log package.log geometry.log geometry-app.log smoke-run.log acceptance-app.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHELTER-macos-x64
          path: |
            dist/SHELTER-macos-x64-*.dmg
            dist/SHA256SUMS.txt
            dist/shelter-version.txt
          if-no-files-found: error

      - name: Upload macOS diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHELTER-macos-ci-logs
          path: |
            configure.log
            build.log
            package.log
            geometry.log
            smoke-run.log
            acceptance-app.log
          if-no-files-found: ignore
          retention-days: 14

  security-unit:
    name: UI and security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download UI regression test
        run: node tests/download_ui_test.js
      - name: Tracker/ad statistics regression test
        run: node tests/blocked_stats_test.js
      - name: UI stylesheet integrity test
        run: node tests/ui_css_test.js
      - name: Settings panel and toolbar regression test
        run: node tests/ui_settings_test.js
      - name: Tab strip and pinned tab regression test
        run: node tests/ui_tabs_test.js
      - name: Extensions page and bridge regression test
        run: node tests/ui_extensions_test.js
      - name: Notification marquee regression test
        run: node tests/ui_toast_marquee_test.js
      - name: CSP hashes and renderer secret isolation regression test
        run: node tests/ui_csp_test.js
      - name: Central UI bridge authorization regression test
        run: node tests/bridge_authorization_test.js
      - name: Single-source version propagation regression test
        run: node tests/app_version_source_test.js
      - name: Compile and run native secret crypto compatibility tests
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -I. tests/secret_crypto_test.cc src/secret_crypto.cc -o secret-crypto-test
          ./secret-crypto-test
      - name: Compile and run path/archive safety tests
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -I. tests/security_paths_test.cc -o security-paths-test
          ./security-paths-test
      - name: Compile and run protection switch tests
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -I. tests/protection_flags_test.cc -o protection-flags-test
          ./protection-flags-test
      - name: Compile and run favicon host tests
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -I. tests/favicon_hosts_test.cc -o favicon-hosts-test
          ./favicon-hosts-test
      - name: Compile and run extension match tests
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -I. tests/extension_match_test.cc -o extension-match-test
          ./extension-match-test
      - name: Compile and run extension engine tests
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -I. tests/extension_engine_test.cc -o extension-engine-test
          ./extension-engine-test
      - name: Compile and run color scheme tests
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -I. tests/color_scheme_test.cc -o color-scheme-test
          ./color-scheme-test

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, security-unit]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
      - name: Generate release SHA-256 checksums
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < assets/SHELTER-windows-x64/shelter-version.txt)"
          mac_version="$(tr -d '\r\n' < assets/SHELTER-macos-x64/shelter-version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version" == "$mac_version" ]]
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match configured SHELTER_VERSION $version" >&2
            exit 1
          fi
          dmg="SHELTER-macos-x64-${version}.dmg"
          files=(
            "assets/SHELTER-windows-x64/SHELTER-Setup-x64.exe"
            "assets/SHELTER-windows-x64/SHELTER-windows-x64-portable.zip"
            "assets/SHELTER-macos-x64/$dmg"
          )
          : > assets/SHA256SUMS.txt
          for file in "${files[@]}"; do
            test -f "$file"
            hash="$(sha256sum "$file" | cut -d ' ' -f1)"
            echo "$hash  ${file##*/}" >> assets/SHA256SUMS.txt
          done
          echo "SHELTER_VERSION=$version" >> "$GITHUB_ENV"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find assets -type f | sort
          dmg="SHELTER-macos-x64-${SHELTER_VERSION}.dmg"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SHELTER ${SHELTER_VERSION}" \
            --notes "Установщики: SHELTER-Setup-x64.exe (Windows x64), ${dmg} (macOS Intel). Также portable zip для Windows. SHA256SUMS.txt содержит контрольные суммы. macOS: ad-hoc подпись без Developer ID и нотаризации; при первом запуске Gatekeeper может потребовать «Открыть»." \
            assets/SHELTER-windows-x64/SHELTER-Setup-x64.exe \
            assets/SHELTER-windows-x64/SHELTER-windows-x64-portable.zip \
            "assets/SHELTER-macos-x64/${dmg}" \
            assets/SHA256SUMS.txt

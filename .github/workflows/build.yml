name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Bootstrap CEF
        shell: bash
        run: CEF_PLATFORM=windows ./scripts/bootstrap-cef.sh
      - name: Build and test
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Package Windows portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\Resources | Out-Null
          Copy-Item build\shelter.exe package\
          Copy-Item resources\ui package\Resources\ui -Recurse
          Copy-Item resources\icons\icon-256.png package\SHELTER.png
          Copy-Item cef\Release\* package\ -Recurse -Force
          Copy-Item cef\Resources\* package\Resources\ -Recurse -Force
          Compress-Archive -Path package\* -DestinationPath SHELTER-windows-x64-portable.zip -Force
      - uses: actions/upload-artifact@v4
        with: { name: SHELTER-windows-x64, path: SHELTER-windows-x64-portable.zip }
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap CEF
        run: CEF_PLATFORM=macos ./scripts/bootstrap-cef.sh
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Package macOS app
        run: |
          mkdir -p package/SHELTER.app/Contents/MacOS package/SHELTER.app/Contents/Resources package/SHELTER.app/Contents/Frameworks
          cp -R build/shelter.app/Contents/MacOS/shelter package/SHELTER.app/Contents/MacOS/
          cp mac/Info.plist package/SHELTER.app/Contents/Info.plist
          cp -R resources/ui package/SHELTER.app/Contents/Resources/ui
          cp resources/icons/icon-1024.png package/SHELTER.app/Contents/Resources/SHELTER.png
          mkdir -p /tmp/SHELTER.iconset
          sips -z 16 16 resources/icons/icon-256.png --out /tmp/SHELTER.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 resources/icons/icon-256.png --out /tmp/SHELTER.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 resources/icons/icon-256.png --out /tmp/SHELTER.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 resources/icons/icon-256.png --out /tmp/SHELTER.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 resources/icons/icon-256.png --out /tmp/SHELTER.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 resources/icons/icon-256.png --out /tmp/SHELTER.iconset/icon_128x128@2x.png >/dev/null
          iconutil -c icns /tmp/SHELTER.iconset -o package/SHELTER.app/Contents/Resources/SHELTER.icns
          cp -R "cef/Release/Chromium Embedded Framework.framework" package/SHELTER.app/Contents/Frameworks/
          mkdir -p "package/SHELTER.app/Contents/Frameworks/SHELTER Helper.app/Contents/MacOS"
          cp build/shelter.app/Contents/MacOS/shelter "package/SHELTER.app/Contents/Frameworks/SHELTER Helper.app/Contents/MacOS/SHELTER Helper"
          cp mac/Helper-Info.plist "package/SHELTER.app/Contents/Frameworks/SHELTER Helper.app/Contents/Info.plist"
          mkdir -p dmg-root
          cp -R package/SHELTER.app dmg-root/SHELTER.app
          ln -s /Applications dmg-root/Applications
          rm -f SHELTER-macos-x64.dmg
          hdiutil detach "$(hdiutil info | awk '/dmg-root/{print $1; exit}')" 2>/dev/null || true
          hdiutil create -volname SHELTER -srcfolder "${GITHUB_WORKSPACE}/dmg-root" -ov -format UDZO "${GITHUB_WORKSPACE}/SHELTER-macos-x64.dmg"
      - name: Smoke test packaged app
        run: |
          APP="${GITHUB_WORKSPACE}/package/SHELTER.app"
          DATA="$HOME/Library/Application Support/SHELTER"
          rm -rf "$DATA"
          "$APP/Contents/MacOS/shelter" > /tmp/shelter-smoke-stdout.log 2>&1 &
          PID=$!
          # Markers are written by the app logger to shelter.log; Chromium's
          # own output (CHECK text included) lands in shelter-cef.log /
          # shelter-stderr.log and is only used for diagnostics.
          MARKER_LOG="$DATA/shelter.log"
          dump_logs() {
            echo "---- processes ----"; pgrep -fl "SHELTER|shelter" || true
            if kill -0 "$PID" 2>/dev/null; then
              sample "$PID" 3 -file /tmp/shelter-sample.txt >/dev/null 2>&1 || true
            fi
            echo "---- stdout ----"; cat /tmp/shelter-smoke-stdout.log || true
            echo "---- stderr ----"; cat "$DATA/shelter-stderr.log" || true
            echo "---- cef log ----"; tail -n 200 "$DATA/shelter-cef.log" || true
            echo "---- app log ----"; tail -n 200 "$MARKER_LOG" || true
            echo "---- main thread sample ----"; head -c 20000 /tmp/shelter-sample.txt || true
            # Job logs/artifacts are unreachable from some networks; copy the
            # key files into annotations so failures stay diagnosable.
            for f in /tmp/shelter-smoke-stdout.log "$DATA/shelter-stderr.log" \
                     "$DATA/shelter-cef.log" "$MARKER_LOG" /tmp/shelter-sample.txt; do
              [ -f "$f" ] || continue
              esc=$(tail -c 40000 "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n')
              printf '::error title=%s::%s\n' "$f" "$esc"
            done
          }
          wait_marker() {
            local marker="$1" budget="$2"
            for i in $(seq 1 "$budget"); do
              sleep 1
              if ! kill -0 "$PID" 2>/dev/null; then
                echo "::error::SHELTER died before marker '$marker' (at ${i}s)"
                dump_logs
                exit 1
              fi
              if [ -f "$MARKER_LOG" ] && grep -q "$marker" "$MARKER_LOG"; then
                echo "marker reached: '$marker' (at ${i}s)"
                return 0
              fi
            done
            echo "::error::marker '$marker' not reached in ${budget}s"
            dump_logs
            kill -9 "$PID" 2>/dev/null || true
            exit 1
          }
          # 1) browser process initializes CEF
          wait_marker "CEF context initialized" 30
          # 2) renderer reports a completed page load (proves helper spawn works)
          wait_marker "load end" 30
          # 3) still alive well past the post-init CHECK window seen in the field
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::SHELTER crashed shortly after page load"
            dump_logs
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          sleep 2
          kill -9 "$PID" 2>/dev/null || true
          echo "smoke test passed"
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/shelter-smoke-stdout.log
            ~/Library/Application Support/SHELTER/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with: { name: SHELTER-macos-x64, path: SHELTER-macos-x64.dmg }

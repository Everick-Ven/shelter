.ach-legend{ display:flex; flex-wrap:wrap; gap:8px 16px; }
.ach-legend-i{ display:flex; align-items:center; gap:7px; border:0; background:none; padding:0; color:var(--text-3); font-size:11px; font-weight:550; cursor:pointer; transition:color .18s; position:relative; }
.ach-legend-i i{ width:8px; height:8px; border-radius:50%; flex:none; }
.ach-legend-i[data-status="earned"] i{ background:rgb(var(--ok)); box-shadow:0 0 8px rgb(var(--ok)/.6); }
.ach-legend-i[data-status="progress"] i{ background:rgb(var(--gc)); box-shadow:0 0 8px rgb(var(--gc)/.6); }
.ach-legend-i[data-status="locked"] i{ background:var(--line-3); }
.ach-legend-i b{ color:var(--text-2); font:600 11px/1 var(--font-d); font-variant-numeric:tabular-nums; }
.ach-legend-i:hover,.ach-legend-i.on{ color:var(--text); }
.profile-ach-card .ach-toggle{ margin-top:auto; width:100%; justify-content:center; min-height:34px; }
.ach-expanded-section{ padding:22px 24px 24px; }
.ach-expanded-section .ach-expanded-tools{ margin-bottom:16px; }
@media (max-width:920px){ .profile-top{ grid-template-columns:1fr; } .profile-id-card{ grid-column:auto; } }

/* --- Виджеты: Помодоро и Менеджер эффективности --- */
.wg-tile{ grid-column:auto; display:flex; flex-direction:column; gap:18px; padding:22px 24px; }
/* --- Витрина наград в карточке профиля (4 полученные иконки в ряд без подписей) + кнопка закрепления + настройка свечения --- */
.profile-awards-row{
  flex:1; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px;
  align-items:center; justify-items:center;
  margin-top:4px; padding:14px 10px;
  border-radius:14px; background:var(--glass-1); border:1px solid var(--glass-border-soft);
}
.profile-award-icon{
  position:relative; width:64px; height:58px; padding:0; border:0; background:none;
  display:grid; place-items:center; cursor:pointer; border-radius:16px;
  transition:transform .22s var(--ease), filter .22s var(--ease);
}
.profile-award-icon:hover{
  transform:translate3d(0,-2px,0) scale(1.05);
  filter:drop-shadow(0 8px 16px rgb(var(--ach-rgb,var(--accent)) / .28));
}
.profile-award-icon:focus-visible{ outline:none; }
.profile-award-icon .ach-emblem{ width:62px; height:54px; flex:none; }
.profile-award-empty{
  width:46px; height:46px; border-radius:50%;
  border:1.5px dashed color-mix(in srgb, var(--line-2) 85%, transparent);
  background:radial-gradient(circle at 50% 35%, var(--glass-2), transparent 75%);
  display:grid; place-items:center; opacity:.55;
}
.profile-award-empty i{
  width:34px; height:34px; border-radius:50%;
  border:1px solid var(--glass-border-soft);
  display:block;
}
.ach-card[role="button"]{ cursor:pointer; }
.ach-card-top-r{ display:flex; align-items:center; gap:6px; margin-left:auto; }
.ach-pin-btn{
  width:26px; height:26px; padding:0; border-radius:8px;
  border:1px solid var(--line); background:color-mix(in srgb, var(--card) 85%, transparent);
  color:var(--text-4); display:grid; place-items:center; flex:none; cursor:pointer;
  transition:color .18s, border-color .18s, background .18s, transform .18s var(--ease);
}
.ach-pin-btn .i{ width:13px; height:13px; transition:transform .18s var(--ease); }
.ach-pin-btn:hover{
  color:var(--text); border-color:var(--line-2); background:var(--hover);
  transform:translateY(-1px);
}
.ach-pin-btn.on{
  color:rgb(var(--accent));
  border-color:rgb(var(--accent) / .42);
  background:rgb(var(--accent) / .14);
  box-shadow:0 0 12px -3px rgb(var(--accent) / .35);
}
.ach-pin-btn.on .i{ transform:rotate(-18deg); }
.ach-pin-btn:focus-visible{ outline:none; }
.glow-palette{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.glow-sw{ width:24px; height:24px; border-radius:50%; border:1.5px solid rgba(255,255,255,.18); background:var(--gc-sw); cursor:pointer; position:relative; transition:transform .2s var(--ease-s),box-shadow .2s; }
.glow-sw:hover{ transform:scale(1.1); }
.glow-sw.on{ box-shadow:0 0 0 2px var(--card), 0 0 0 3.5px var(--text); }
.glow-picker-wrap{ position:relative; display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:9px; background:var(--card-2); border:1px solid var(--line-2); font-size:11.5px; font-weight:550; color:var(--text-2); cursor:pointer; transition:border-color .2s,color .2s; }
.glow-picker-wrap:hover{ border-color:var(--line-3); color:var(--text); }
.glow-picker-dot{ width:12px; height:12px; border-radius:50%; background:var(--gc-custom,#5E8BFF); border:1px solid rgba(255,255,255,.25); flex:none; }
.glow-picker-wrap input[type="color"]{ position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; border:0; padding:0; }
.wg-head{ display:flex; align-items:center; gap:12px; }
.wg-ic{ width:38px; height:38px; display:grid; place-items:center; flex:none; border-radius:12px; border:1px solid var(--glass-border-soft); background:var(--glass-2); color:rgb(var(--gc)); }
.wg-ic .i{ width:19px; height:19px; }
.wg-ic.eff{ color:rgb(var(--ga)); }
.wg-tt{ flex:1; min-width:0; }
.wg-tt b{ display:block; font:600 14.5px/1.2 var(--font-d); color:var(--text); letter-spacing:-.01em; }
.wg-tt small{ display:block; margin-top:2px; color:var(--text-3); font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wg-head .icon-btn{ width:32px; height:32px; flex:none; }
.wg-head .seg{ flex:none; }

.pomo-body{ display:flex; align-items:center; gap:22px; flex:1; }
.pomo-ring{ position:relative; width:126px; height:126px; flex:none; }
/* overflow:visible — иначе свечение дуги обрезается прямоугольником svg и
   выглядит квадратной рамкой по краю кольца */
.pomo-ring svg{ width:100%; height:100%; transform:rotate(-90deg); overflow:visible; }
.pomo-ring circle{ fill:none; stroke-width:8; }
.pomo-ring circle.trk{ stroke:var(--glass-3); }
.pomo-ring circle.val{ stroke:rgb(var(--gc)); stroke-linecap:round; transition:stroke-dasharray .6s var(--ease),stroke .3s; filter:drop-shadow(0 0 8px rgb(var(--gc)/.5)); }
.pomo-tile.is-break .pomo-ring circle.val{ stroke:rgb(var(--ok)); filter:drop-shadow(0 0 8px rgb(var(--ok)/.5)); }
.pomo-time-wrap{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.pomo-time-wrap b{ font:650 27px/1 var(--font-d); letter-spacing:-.02em; color:var(--text); font-variant-numeric:tabular-nums; }
/* Статус («Фокус» / «Короткий перерыв») — только кнопкой вне кольца таймера */
.pomo-status{ display:inline-flex; align-items:center; gap:7px; height:26px; padding:0 11px; border-radius:99px;
  border:1px solid var(--line-2); background:var(--pill); color:var(--text-2);
  font-size:11px; font-weight:650; letter-spacing:.02em; cursor:pointer; flex:none;
  transition:color .2s,border-color .2s,background .2s; }
.pomo-status i{ width:7px; height:7px; border-radius:50%; background:rgb(var(--gc)); box-shadow:0 0 8px rgb(var(--gc)/.7); flex:none; }
.pomo-status.break i{ background:rgb(var(--ok)); box-shadow:0 0 8px rgb(var(--ok)/.7); }
.pomo-status:hover{ color:var(--text); border-color:var(--line-3); }
.pomo-side{ flex:1; min-width:0; display:flex; flex-direction:column; gap:9px; }
.pomo-side .btn{ width:100%; justify-content:center; }
.pomo-cycles{ display:flex; align-items:center; gap:8px; color:var(--text-3); font-size:11px; margin-top:2px; }
.pomo-cycles .i{ width:14px; height:14px; }
.pomo-cycles b{ color:var(--text-2); font-weight:650; }

.eff-body{ display:flex; flex-direction:column; gap:16px; flex:1; }
.eff-top{ display:flex; align-items:center; gap:18px; }
.eff-score{ position:relative; width:64px; height:64px; flex:none; }
.eff-score svg{ width:100%; height:100%; transform:rotate(-90deg); }
.eff-score circle{ fill:none; stroke-width:6; }
.eff-score circle.trk{ stroke:var(--glass-3); }
.eff-score circle.val{ stroke-linecap:round; transition:stroke-dasharray .6s var(--ease); }
.eff-score circle.val.hi{ stroke:rgb(var(--ok)); filter:drop-shadow(0 0 6px rgb(var(--ok)/.5)); }
.eff-score circle.val.mid{ stroke:rgb(var(--gc)); filter:drop-shadow(0 0 6px rgb(var(--gc)/.5)); }
.eff-score circle.val.lo{ stroke:rgb(var(--warn)); filter:drop-shadow(0 0 6px rgb(var(--warn)/.5)); }
.eff-score-txt{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.eff-score-txt b{ font:650 14.5px/1 var(--font-d); color:var(--text); letter-spacing:-.02em; }
.eff-bar-wrap{ flex:1; min-width:0; }
.eff-bar{ display:flex; height:8px; border-radius:99px; overflow:hidden; background:var(--glass-3); box-shadow:inset 0 1px 2px rgba(0,0,0,.18); }
.eff-seg{ width:var(--w,0%); height:100%; }
.eff-seg.good{ background:rgb(var(--ok)); }
.eff-seg.neutral{ background:var(--line-3); }
.eff-seg.bad{ background:rgb(var(--warn)); }
.eff-legend{ display:flex; gap:14px; margin-top:9px; flex-wrap:wrap; }
.eff-leg{ display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-3); font-weight:550; }
.eff-leg i{ width:7px; height:7px; border-radius:50%; flex:none; }
.eff-leg.good i{ background:rgb(var(--ok)); box-shadow:0 0 6px rgb(var(--ok)/.6); }
.eff-leg.neutral i{ background:var(--line-3); }
.eff-leg.bad i{ background:rgb(var(--warn)); box-shadow:0 0 6px rgb(var(--warn)/.6); }
.eff-leg b{ color:var(--text-2); font-weight:650; }
.eff-list{ display:flex; flex-direction:column; gap:9px; }
.eff-row{ display:flex; align-items:center; gap:10px; }
.eff-row .nm{ flex:none; width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px; color:var(--text-2); font-weight:550; }
.eff-row .pbar{ flex:1; height:6px; }
.eff-row b.num{ flex:none; width:54px; text-align:right; font-size:11px; color:var(--text-3); font-variant-numeric:tabular-nums; }
.eff-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
.eff-dot.good{ background:rgb(var(--ok)); box-shadow:0 0 6px rgb(var(--ok)/.6); }
.eff-dot.neutral{ background:var(--line-3); }
.eff-dot.bad{ background:rgb(var(--warn)); box-shadow:0 0 6px rgb(var(--warn)/.6); }
@media (max-width:860px){ .wg-tile{ grid-column:1 / -1; } .pomo-body{ flex-direction:column; align-items:stretch; } .pomo-ring{ align-self:center; } }

/* --- Ползунок «Прозрачность интерфейса» в панели «Анимации и вкладки» --- */
.q-val{ font:650 12px/1 var(--font-d); color:var(--text-2); font-variant-numeric:tabular-nums; }
.rng{ -webkit-appearance:none; appearance:none; width:100%; height:7px; border-radius:99px; background:var(--glass-3); border:1px solid var(--glass-border-soft); outline:none; cursor:pointer; margin:4px 0 6px; box-shadow:inset 0 1px 2px rgba(0,0,0,.22); transition:box-shadow .25s var(--ease); }
.rng:hover{ box-shadow:inset 0 1px 2px rgba(0,0,0,.22), 0 0 0 3px rgb(var(--gc)/.1); }
.rng::-webkit-slider-runnable-track{ height:7px; border-radius:99px; background:transparent; }
.rng::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:17px; height:17px; border-radius:50%; margin-top:-5.5px;
  background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.16) 42%, transparent 58%), linear-gradient(155deg, rgb(var(--ga)), rgb(var(--gb)) 55%, rgb(var(--gc)));
  box-shadow:0 3px 10px -2px rgb(var(--gc)/.65), 0 0 0 3px var(--card), inset 0 1px 1px rgba(255,255,255,.5); cursor:pointer; transition:transform .18s var(--ease-s); }
.rng:hover::-webkit-slider-thumb{ transform:scale(1.14); }
.rng:active::-webkit-slider-thumb{ transform:scale(1.05); }
.rng::-moz-range-track{ height:7px; border-radius:99px; background:transparent; }
.rng::-moz-range-progress{ height:7px; border-radius:99px; background:linear-gradient(90deg, rgb(var(--ga)), rgb(var(--gc))); }
.rng::-moz-range-thumb{ width:17px; height:17px; border:0; border-radius:50%;
  background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.16) 42%, transparent 58%), linear-gradient(155deg, rgb(var(--ga)), rgb(var(--gb)) 55%, rgb(var(--gc)));
  box-shadow:0 3px 10px -2px rgb(var(--gc)/.65), 0 0 0 3px var(--card), inset 0 1px 1px rgba(255,255,255,.5); cursor:pointer; }

/* --- Панель управления виджетами (Показать виджет + маленькая кнопка "+") --- */
.wg-bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-bottom:20px; padding:10px 14px;
  border-radius:var(--r-m);
  background:var(--glass-1);
  border:1px solid var(--glass-border-soft);
  box-shadow:var(--hi);
}
.wg-show-btn{ height:32px; padding:0 12px; font-size:12.5px; border-radius:10px; gap:8px; }
.wg-show-btn .chip{ height:20px; padding:0 7px; font-size:10.5px; border-radius:99px; }
.wg-add-sm{ width:32px; height:32px; padding:0; border-radius:10px; flex:none; }
.wg-add-sm .i{ width:15px; height:15px; }
.wg-bar-hint{ margin-left:auto; font-size:11.5px; color:var(--text-3); }
@media (max-width:680px){ .wg-bar-hint{ display:none; } }
.wg-picker-menu .mi .cbx{ margin-right:2px; flex:none; pointer-events:none; }

/* --- Профиль: блок «Активировать ключ» --- */
.profile-key-box{
  margin-top:12px; padding-top:12px;
  border-top:1px solid var(--glass-border-soft);
  display:flex; flex-direction:column; gap:7px;
}
.profile-key-label{
  display:flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:600; color:var(--text-2);
}
.profile-key-label .i{ width:14px; height:14px; color:rgb(var(--accent)); }
.profile-key-row{ display:flex; align-items:center; gap:7px; }
.profile-key-input{ flex:1; min-width:0; height:32px; font-size:12px; padding:0 10px; border-radius:9px; font-family:var(--mono); letter-spacing:.03em; }
.profile-key-btn{ height:32px; padding:0 12px; font-size:12px; border-radius:9px; flex:none; }

/* --- Ассистент (.dt-app) --- */
.dt-app{container-name:dt-shell;container-type:inline-size;position:absolute;inset:0;display:grid;grid-template-columns:264px minmax(0,1fr);min-width:0;min-height:0;height:100%;overflow:hidden;background:var(--surface);color:var(--text)}
.dt-app.rail-collapsed{grid-template-columns:56px minmax(0,1fr)}
.dt-app.rail-collapsed .dt-rail{padding:17px 8px 12px;gap:14px;align-items:center;overflow:hidden}
.dt-app.rail-collapsed .dt-rail-brand{padding:0;margin:0;height:auto;justify-content:center;gap:0}
.dt-app.rail-collapsed .dt-rail-brand>span{display:none}
.dt-app.rail-collapsed .dt-rail-brand .dt-rail-min{margin:0}
.dt-app.rail-collapsed .dt-new{width:36px;height:36px;padding:0;justify-content:center;gap:0;font-size:0}
.dt-app.rail-collapsed .dt-new .kbd{display:none}
.dt-app.rail-collapsed .dt-thread-search,.dt-app.rail-collapsed .dt-thread-scroll,.dt-app.rail-collapsed .dt-rail-foot{display:none}
.dt-app.rail-collapsed .dt-rail-scrim{display:none}
.dt-rail .dt-rail-brand .dt-rail-min{margin-left:auto;flex:none}
.dt-rail-min .rn-max{display:none}
.dt-app.rail-collapsed .dt-rail-min .rn-min{display:none}
.dt-app.rail-collapsed .dt-rail-min .rn-max{display:block}
.dt-rail{position:relative;z-index:2;display:flex;flex-direction:column;min-width:0;min-height:0;padding:17px 13px 12px;background:var(--surface);border-right:1px solid var(--line)}
.dt-rail-brand{height:49px;display:flex;align-items:center;gap:10px;padding:0 7px;margin-bottom:12px}
.dt-brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,rgb(var(--ga)),rgb(var(--gc)) 56%,rgb(var(--gb)));box-shadow:0 5px 18px rgb(var(--gc)/.28);flex:none}
.dt-brand-mark .i{width:18px;height:18px}
.dt-rail-brand>span:nth-child(2){min-width:0;flex:1}
.dt-rail-brand b{display:block;font:600 14px var(--font-d);letter-spacing:-.01em}
.dt-rail-brand small{display:block;font-size:11px;color:var(--text-3);margin-top:2px}
.dt-private{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:rgb(var(--ok));background:rgb(var(--ok)/.09);border:1px solid rgb(var(--ok)/.16)}
.dt-private .i{width:13px;height:13px}
.dt-new{height:39px;display:flex;align-items:center;gap:9px;padding:0 11px;border-radius:11px;border:1px solid rgb(var(--accent)/.23);background:linear-gradient(120deg,rgb(var(--accent)/.12),rgb(var(--gc)/.08));color:var(--text);font-size:12px;font-weight:550;text-align:left;transition:background .2s,border-color .2s,transform .18s var(--ease);flex:none}
.dt-new:hover{background:linear-gradient(120deg,rgb(var(--accent)/.2),rgb(var(--gc)/.13));border-color:rgb(var(--accent)/.38);transform:translateY(-1px)}
.dt-new .i{width:16px;height:16px;color:rgb(var(--accent))}
.dt-new .kbd{margin-left:auto;padding:2px 5px;border-radius:5px;border:1px solid var(--line-2);font-size:10px;color:var(--text-3)}
.dt-thread-search{height:35px;display:flex;align-items:center;gap:8px;padding:0 10px;margin:13px 1px 9px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);color:var(--text-3);flex:none}
.dt-thread-search>.i{width:14px;height:14px;flex:none}
.dt-thread-search input{width:100%;min-width:0;background:none;border:0;outline:0;color:var(--text);font:400 11px var(--font)}
.dt-thread-search input::placeholder{color:var(--text-4)}
.dt-thread-scroll{flex:1;min-height:0;overflow:auto;padding:1px 0 10px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.dt-group-label{padding:11px 9px 5px;color:var(--text-4);font-size:10px;font-weight:650;letter-spacing:.075em;text-transform:uppercase}
.dt-thread-wrap{position:relative;width:100%;min-height:53px;border-radius:10px}
.dt-thread{width:100%;min-height:53px;display:flex;align-items:center;gap:9px;padding:7px 37px 7px 8px;border-radius:10px;text-align:left;color:var(--text-2);background:transparent;transition:background .18s,color .18s;position:relative}
.dt-thread:hover{background:var(--hover);color:var(--text)}
.dt-thread.active{background:linear-gradient(100deg,rgb(var(--accent)/.13),rgb(var(--gc)/.07));box-shadow:inset 0 0 0 1px rgb(var(--accent)/.13);color:var(--text)}
.dt-thread-ico{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:var(--card-2);color:var(--text-3);flex:none}
.dt-thread.active .dt-thread-ico{background:rgb(var(--accent)/.12);color:rgb(var(--accent))}
.dt-thread-ico .i{width:14px;height:14px}
.dt-thread-text{min-width:0;flex:1}
.dt-thread-text b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:550}
.dt-thread-text small{display:block;max-width:100%;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--text-4)}
.dt-thread-dot{width:5px;height:5px;border-radius:50%;background:rgb(var(--accent));opacity:0;flex:none}
.dt-thread.active .dt-thread-dot{opacity:.85}

/* Native CEF pages are a separate compositor surface. Backdrop-filter may not
   sample that surface directly, so the fallback keeps enough tinted translucency
   for contrast while a restrained highlight, rim and live backdrop preserve the
   glass appearance. Visual blurs; Balance keeps the same transparency without blur. */
body.native-content-visible:not([data-gfx="perf"]){
  --native-popup-opacity:clamp(76%,calc(var(--glass-op) * .85 * 1% + 14%),90%);
  --native-popup-menu:color-mix(in srgb,var(--menu) var(--native-popup-opacity),transparent);
  --native-popup-card:color-mix(in srgb,var(--card) var(--native-popup-opacity),transparent);
}
body.native-content-visible:not([data-gfx="perf"]) .menu,
body.native-content-visible:not([data-gfx="perf"]) .palette,
body.native-content-visible:not([data-gfx="perf"]) .suggest,
body.native-content-visible:not([data-gfx="perf"]) .findbar,
body.native-content-visible:not([data-gfx="perf"]) .toast,
body.native-content-visible:not([data-gfx="perf"]) .tip,
body.native-content-visible:not([data-gfx="perf"]) .dl-float{
  background-color:var(--native-popup-menu);
  background-image:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.035) 32%,transparent 72%);
  border-color:color-mix(in srgb,var(--glass-border) 84%,rgb(var(--ga)/.28));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 18px 44px -24px rgba(0,0,0,.46),var(--glow-lift-lg);
}
body.native-content-visible:not([data-gfx="perf"]) .modal,
body.native-content-visible:not([data-gfx="perf"]) .settings,
body.native-content-visible:not([data-gfx="perf"]) .devtools{
  background-color:var(--native-popup-card);
  background-image:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 32%,transparent 72%);
  border-color:color-mix(in srgb,var(--glass-border) 84%,rgb(var(--ga)/.28));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 22px 58px -30px rgba(0,0,0,.48),var(--glow-lift-lg);
}
/* Ambient decoration is static while the native page owns the content area;
   resuming the CSS animation when returning to the dashboard is automatic. */
body.native-content-visible .ambient i{animation-play-state:paused}

      }
    } catch (_) {}
  });
})();

    let shown = +el.dataset.shown || 0;

async function runBrowsingClear(sel, durMs, rangeLabel) {

  const listRu = arr => arr.length === 1 ? arr[0] : arr.slice(0, -1).join(', ') + ' и ' + arr[arr.length - 1];
  if (sel.has('history')) {
    const n0 = S.visits.length;
    S.visits = S.visits.filter(v => !all && v.at < cut);
    const n = n0 - S.visits.length;
    rows.push({ k: 'История просмотра', v: n ? `${fmtN(n)} ${plural(n, ['запись', 'записи', 'записей'])}${all ? '' : ' · ' + rangeLabel}` : 'нет записей' });
  }
  if (sel.has('downloads')) {
    const keep = d => (d.state === 'run' || d.state === 'pause') || (!all && d.at < cut);
    const gone = S.downloads.filter(d => !keep(d));
    S.downloads = S.downloads.filter(keep);
    const mb = gone.reduce((s2, d) => s2 + (+d.size || 0), 0);
    rows.push({ k: 'Загрузки', v: gone.length ? `${fmtN(gone.length)} ${plural(gone.length, ['файл', 'файла', 'файлов'])} · ${fmtSize(mb)}` : 'нет записей' });
  }
  const fulls = [];
  if (sel.has('passwords')) {
    const n = (S.passwords || []).length; S.passwords = [];
    rows.push({ k: 'Пароли (включая пароль синхронизации)', v: n ? `${fmtN(n)} ${plural(n, ['пароль', 'пароля', 'паролей'])}` : 'нет записей' });
    fulls.push('пароли');
  }
  if (sel.has('autofill')) {
    const n = (S.addresses || []).length; S.addresses = [];
    rows.push({ k: 'Данные автозаполнения форм', v: n ? `${fmtN(n)} ${plural(n, ['запись', 'записи', 'записей'])}` : 'нет записей' });
    fulls.push('автозаполнение');
  }
  if (sel.has('siteset')) {
    const n = Object.keys(S.sitePerms || {}).length; S.sitePerms = {};
    rows.push({ k: 'Настройки сайтов', v: n ? `${fmtN(n)} ${plural(n, ['сайт', 'сайта', 'сайтов'])}` : 'нет записей' });
    fulls.push('настройки сайтов');

    if (sel.has('saved')) mask.push('LOCAL_STORAGE', 'INDEXED_DB');

function bmApplyDrop(dragId, targetId, zone, adoptFolder) {
  const item = S.bookmarks.find(x => x.id === dragId), target = S.bookmarks.find(x => x.id === targetId);
  if (!item || !target || item === target) return;
  const q = $('#bmQ') ? $('#bmQ').value : '';
  if (zone === 'into' && !target.folder) {
    const name = bmUniqueFolderName();
    target.folder = name; item.folder = name;
    S.bookmarks.splice(S.bookmarks.indexOf(item), 1);
    S.bookmarks.splice(S.bookmarks.indexOf(target) + 1, 0, item);
    persist(); refreshBmView(q);
    toast('Создана папка «' + name + '»', { icon: 'folder' });
    return;
  }
  /* zone === 'into' на цели, уже имеющей папку → всегда перенимаем папку (и в плитках, и в дереве).
     zone 'before'/'after' → в дереве визуально сгруппировано по папкам, поэтому перенимаем контекст цели;
     в плитках (adoptFolder=false) это чистая перестановка без смены папки. */
  if (zone === 'into' || adoptFolder) {
    if (target.folder) item.folder = target.folder; else delete item.folder;
  }

function bindBmDrag(container, itemSel, adoptFolder) {
  if (!container || container._bmDragBound) return; container._bmDragBound = true;
  let dragId = null;
  const clearMarks = () => container.querySelectorAll('.dragging,.drop-before,.drop-after,.drop-into').forEach(x => x.classList.remove('dragging', 'drop-before', 'drop-after', 'drop-into'));
  container.addEventListener('dragstart', e => {
    const it = e.target.closest(itemSel);
    if (!it || it.getAttribute('draggable') !== 'true') { e.preventDefault(); return; }
    dragId = it.dataset.id;
    try { if (e.dataTransfer) { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } } catch (_) {}
    requestAnimationFrame(() => it.classList.add('dragging'));
    hideTip();
  });
  container.addEventListener('dragover', e => {
    if (!dragId) return;
    e.preventDefault();
    try { if (e.dataTransfer) e.dataTransfer.dropEffect = 'move'; } catch (_) {}
    const fh = e.target.closest('.bmt-folder-h');
    $$('.drop-before,.drop-after,.drop-into', container).forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-into'));
    if (fh) { fh.classList.add('drop-into'); return; }
    const it = e.target.closest(itemSel);
    if (it && it.dataset.id !== dragId) {
      const zone = bmDragZone(e, it.getBoundingClientRect());
      it.classList.add(zone === 'before' ? 'drop-before' : zone === 'after' ? 'drop-after' : 'drop-into');
    }
  });
  container.addEventListener('drop', e => {
    if (!dragId) return;
    e.preventDefault();
    const id = dragId; dragId = null;
    clearMarks();
    const fh = e.target.closest('.bmt-folder-h');
    if (fh) { bmSetFolder(id, fh.dataset.folder); return; }
    const it = e.target.closest(itemSel);
    if (it && it.dataset.id !== id) { bmApplyDrop(id, it.dataset.id, bmDragZone(e, it.getBoundingClientRect()), adoptFolder); return; }
    if (e.target.closest('#bmTree') || e.target.closest('#bmGrid')) {
      const item = S.bookmarks.find(x => x.id === id);
      if (item && item.folder) {
        delete item.folder;
        S.bookmarks.splice(S.bookmarks.indexOf(item), 1); S.bookmarks.push(item);
        persist(); refreshBmView($('#bmQ') ? $('#bmQ').value : '');
        toast('Закладка вынесена из папки', { icon: 'folder' });
      }
    }
  });
  container.addEventListener('dragend', clearMarks);

function profileAvatarDataUrl(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\/(?:jpeg|png|webp)$/i.test(file.type || '')) { reject(new Error('Выберите изображение PNG, JPEG или WebP.')); return; }
    if (file.size > 5 * 1024 * 1024) { reject(new Error('Файл должен быть меньше 5 МБ.')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Не удалось прочитать файл.'));
    reader.onload = () => {
      const image = new Image();
      image.onerror = () => reject(new Error('Не удалось открыть это изображение.'));
      image.onload = () => {
        const size = 320, scale = Math.max(size / image.naturalWidth, size / image.naturalHeight);
        const width = image.naturalWidth * scale, height = image.naturalHeight * scale;
        const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) { reject(new Error('Обработка изображения недоступна.')); return; }
        ctx.drawImage(image, (size - width) / 2, (size - height) / 2, width, height);
        try { resolve(canvas.toDataURL('image/jpeg', .84)); } catch (e) { reject(new Error('Не удалось подготовить изображение.')); }
      };
      image.src = String(reader.result || '');
    };
    reader.readAsDataURL(file);
  });
}

function showAchievementDetail(id) {

  const d = profileActivity(), unlocks = captureProfileUnlocks(d), m = d.metric[a.metric], status = profileAchievementStatus(a, m, unlocks);

    <div class="modal-b ach-detail-body"><p>${esc(a.desc)}</p>${privacyChecklist}<div class="ach-detail-status ${earned ? 'is-earned' : inProgress ? 'is-progress' : ''}"><span>${ico(earned ? 'check' : inProgress ? 'activity' : 'lock')}${stateText}</span><b>${esc(progress)}</b></div><div class="ach-track"><i style="--ach-progress:${pct.toFixed(1)}%"></i></div>${a.id === 'firstPayment' ? `<div class="ach-payment-callout"><button class="btn primary" data-ach-pay>${ico('wallet')}Открыть платёжный шлюз</button></div>` : ''}</div>` });
  modal.scrim.addEventListener('click', e => {
    const pinBtn = e.target.closest('[data-ach-modal-pin]');
    if (pinBtn) {
      toggleAchievementPin(pinBtn.dataset.achModalPin);
      const nowPinned = profilePinnedIds().includes(a.id);
      pinBtn.classList.toggle('on', nowPinned);
      pinBtn.setAttribute('aria-pressed', nowPinned);
      pinBtn.dataset.tip = nowPinned ? 'Открепить из профиля' : 'Закрепить в профиле';
      return;
    }
    if (e.target.closest('[data-ach-close]')) closeModal(modal);
    else if (e.target.closest('[data-ach-pay]')) { closeModal(modal); openPaymentGateway(); }
  });
}

function dtSubmitPrompt(text) {
  const q = String(text || '').trim();
  if (!q) { const inp = $('#dtInput'); if (inp) inp.focus(); return; }
  const st = dtState();
  let th = dtActiveThread();
  if (!th) {
    th = { id: uid('dt'), title: q.slice(0, 48), pinned: false, at: Date.now(), messages: [] };
    S.ui.dtThreads.unshift(th);
    st.activeId = th.id;
  }
  if (!th.messages.length || th.title === 'Новый диалог') {
    th.title = q.length > 48 ? q.slice(0, 48) + '…' : q;
  }
  th.at = Date.now();
  const userMsg = { id: uid('dtm'), role: 'user', text: q, at: Date.now() };
  const pendingId = uid('dtm');
  const pendingMsg = { id: pendingId, role: 'assistant', thinking: true, prompt: q, at: Date.now() };
  th.messages.push(userMsg, pendingMsg);
  const inp = $('#dtInput');
  if (inp) { inp.value = ''; autoGrow(inp); }
  dtRefreshUI(true);
  persist();

  DT_CLEANUP();
  const finishWith = payload => {
    const idx = th.messages.findIndex(x => x.id === pendingId);
    const ans = Object.assign({ id: pendingId, role: 'assistant', prompt: q, at: Date.now() }, payload);
    if (idx >= 0) th.messages[idx] = ans;
    else th.messages.push(ans);
    persist();
    dtRefreshUI(true);
  };

  if (S.ai && S.ai.baseUrl && NAT && typeof NAT.agentChat === 'function') {
    Promise.resolve(NAT.agentChat(S.ai, q)).then(r => {
      if (r && r.ok && r.text) {
        finishWith({
          mode: S.ai.model || 'API',
          paragraphs: String(r.text).split(/\n{2,}/).filter(Boolean),
          actions: [{ label: 'Искать в ' + ENGINES[S.engine].name, icon: 'search', act: 'searchIn', engine: S.engine, q }]
        });
      } else {
        const local = dtBuildLocalReply(q);
        local.paragraphs.unshift('Внешний API вернул ошибку (' + ((r && r.error) || 'нет ответа') + '), поэтому ответ сформирован локальным движком SHELTER AI:');
        finishWith(local);
      }
    }).catch(() => {
      const local = dtBuildLocalReply(q);
      finishWith(local);
    });
    return;
  }

  st.timer = setTimeout(() => {
    st.timer = 0;
    finishWith(dtBuildLocalReply(q));
  }, REDUCED() ? 60 : 340);
}

      dotAfterAnimation: dotAfter ? dotAfter.animationName : '',
      spotLights: document.querySelectorAll('.spot-on').length,
      cardBackground: shadowCss ? shadowCss.backgroundColor : '',
      backgroundImage: shadowCss.backgroundImage,
      hero: hero
    };
    probeSurface.remove();
    probeGlass.remove();
    return snapshot;
  },
  openSettings: sec => openSettings(sec)
};
window.shelterApplyExt = list => applyExtList(list);
window.navBack = goStackBack;
window.navForward = goStackFwd;
window.navRefresh = () => { const t = curTab(); if (t) loadUrl(t, t.url, { push: false }); };
window.shelter = { version: VERSION, theme: k => setTheme(k), ghost: () => toggleGhost(), navigate: v => navigate(v), openPage: p => openPage(p) };

/* =========================================================
   Запуск
   ========================================================= */
function init() {
  load();
  document.documentElement.setAttribute('data-theme', S.theme);
  applyGfx(); applyGlassOp(); applyGlowPrefs(); installFontScale();
  const app = $('#app');
  if (S.ui.collapsed || (innerWidth < 980 && innerWidth > 720)) app.classList.add('collapsed');
  const _sbk = document.querySelector('.sb-search .kbd'); if (_sbk) _sbk.textContent = kb(_sbk.textContent);
  renderControls(); renderSpaceRow(); renderTabs(); renderUser(); renderBadges();
  initTabDnD(); initOmnibox(); initHeroInput(); initFind(); initWinLights();
  applyTabPos(); applyBmPos(); applyPers();
  $('#tabList').addEventListener('scroll', tabsScrollSync, { passive: true });
  if (S.ui.device && S.ui.device !== 'desktop') setDevice(S.ui.device);
  if (S.ui.zoom !== 100) setZoom(S.ui.zoom);
  renderView(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { initSegs(); positionNavInd(); syncThemeUI(); Hero.relayout(); });
  window.addEventListener('resize', debounce(() => { positionNavInd(); syncThemeUI(); initSegs(); tabsScrollSync(); }, 120));
  setInterval(() => { if (!document.hidden && !$('#hero').hidden) { const g = $('#greet'); const t = greeting(); if (g && g.textContent !== t) g.textContent = t; } }, 60000);
  /* baseline достижений сеанса: что получено ДО старта — не уведомляем */
  try { T.profileAchievementSnapshot = profileAchievementStatuses(profileActivity(), storedProfileUnlocks()); } catch (_) {}
  syncWebScheme();
  /* Первая запись (миграция/синхронизация) — вне критического пути загрузки:
     saveNow шифрует историю/чаты (~80-100мс на переполненном профиле),
     выносим до idle, чтобы первый кадр и DOM не ждали. */
  (window.requestIdleCallback || (f => setTimeout(f, 0)))(saveNow);
}
init();
})();
</script>
<script>
/* =========================================================
   SHELTER · Premium glass — курсорная подсветка (спотлайт)
   Единый деликатный спотлайт только на одной (внутренней) поверхности
   под курсором без задвоения свечения и без залипания по центру.
   ========================================================= */
(function(){
  var SEL = '.kpi,.tk-stat,.profile-stat,.profile-award-slot,.bm,.ext,.cert,.q-tile,.tabs-card,.day,.ach-card,.tcard,.card,.stats,.chart,.set-card,.eq,.wcol,.site-card,.checkout-card';
  var last = null, lastRect = null, pending = null, raf = 0;
  function clearSpot(){
    if (last) {
      last.classList.remove('spot-on');
      last.style.removeProperty('--mx'); last.style.removeProperty('--my');
      last = null; lastRect = null;
    }
  }
  function resetSpot(){
    pending = null;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    clearSpot();
  }
  window.shelterClearGlowSpot = resetSpot;
  function invalidateRect(){ lastRect = null; }
  function apply(){
    raf = 0;
    var e = pending; pending = null;
    if (!e) return;
    if (document.body.dataset.gfx !== 'beauty' || document.body.classList.contains('glow-off')) {
      clearSpot();
      return;
    }
    var el = e.target && e.target.closest ? e.target.closest(SEL) : null;
    if (last && last !== el) { last.classList.remove('spot-on'); lastRect = null; }
    if (el) {
      var r = (el === last && lastRect) ? lastRect : (lastRect = el.getBoundingClientRect());
      if (r.width > 0 && r.height > 0) {
        el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
        el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
        if (el !== last) el.classList.add('spot-on');
      }
    }
    last = el;
  }
  function onMove(e){
    if (document.body.dataset.gfx !== 'beauty' || document.body.classList.contains('glow-off')) { clearSpot(); return; }
    pending = e;
    if (!raf) raf = requestAnimationFrame(apply);
  }
  document.addEventListener('pointermove', onMove, { passive: true });
  document.addEventListener('pointerleave', clearSpot, { passive: true });
  window.addEventListener('scroll', invalidateRect, { capture: true, passive: true });
  window.addEventListener('resize', invalidateRect, { passive: true });
})();
</script>

   ========================================================= */
.page{width:100%;max-width:none;margin:0;padding:clamp(22px,2.4vw,36px) clamp(24px,2.8vw,44px) 52px;box-sizing:border-box}
.page.narrow{width:100%;max-width:none;margin:0}
.page-h{display:flex;align-items:flex-end;flex-wrap:wrap;gap:14px 18px;margin-bottom:24px}
.page-h .ttl{flex:1;min-width:220px}
.page-title{font:600 27px/1.12 var(--font-d);letter-spacing:-.028em;display:flex;align-items:center;gap:12px}
.page-sub{color:var(--text-3);font-size:13px;margin-top:7px}
.page-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.wg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-content:start}
.wg-add{aspect-ratio:1;min-height:168px;border-radius:20px;border:1.5px dashed var(--line-2);background:transparent;color:var(--text-3);display:grid;place-items:center;cursor:default}
.wg-add .i{width:32px;height:32px}
.wg-add:hover{border-color:var(--line-3);color:var(--text-2);background:var(--hover)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--hi);position:relative}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:30px}
.card-h h3{flex:1;font-size:15px;font-weight:600;letter-spacing:-.012em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.card-h h3 .i{width:18px;height:18px;color:var(--text-2)}
.pad{padding:18px 20px}

/* --- Дашборд --- */
.dash-top{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(300px,1fr);gap:16px}
.dash-right{display:grid;grid-template-rows:auto 1fr;gap:16px;min-width:0}
.dash-bottom{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:16px}
.stats{padding:18px 20px 20px;overflow:hidden;display:flex;flex-direction:column}
.stats::before{content:none}
@keyframes glowB{50%{opacity:.55;transform:translate3d(20px,10px,0)}}
.stats-body{display:grid;grid-template-columns:176px minmax(0,1fr);gap:14px;position:relative;flex:1;min-height:270px}
.kpis{display:grid;grid-template-rows:1fr 1fr;gap:12px}
.kpi{border-radius:16px;background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);padding:14px 15px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:var(--hi)}
.kpi .kl{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.kpi .kl .i{width:15px;height:15px;color:var(--text-3)}
.kpi .kv2{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px}
.kpi .kv2 b{font:500 30px/1 var(--font-d);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .kv2 small{font-size:12px;color:var(--text-3)}
.chart{position:relative;height:100%;min-height:250px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card-2),transparent 85%);overflow:hidden}
.chart-grid{position:absolute;left:40px;right:16px;top:18px;bottom:34px}
.chart-grid span{position:absolute;left:-34px;right:0;height:0;border-top:1px dashed var(--line-2);font-size:10.5px;color:var(--text-3);line-height:0}
.chart-grid span em{font-style:normal;position:absolute;left:0;top:0;transform:translateY(-50%);width:26px;text-align:right}
.bars{position:absolute;left:48px;right:22px;top:18px;bottom:34px;display:flex;align-items:flex-end;gap:10px}
.bar{flex:1;height:100%;position:relative;display:flex;align-items:flex-end;justify-content:center;cursor:default;min-width:0}
.bar i{display:block;width:100%;max-width:20px;height:var(--h);border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--bar-hi),var(--bar-lo));
  transform-origin:50% 100%;transform:scaleY(.001);transition:transform .9s var(--ease),filter .2s;transition-delay:calc(var(--i) * 38ms)}
.chart.in .bar i{transform:scaleY(1)}
.bar .refl{position:absolute;top:100%;left:0;right:0;margin:1px auto 0;max-width:20px;height:calc(var(--h) * .28);border-radius:3px 3px 7px 7px;
  background:linear-gradient(180deg,var(--bar-lo),transparent);opacity:0;transition:opacity .9s var(--ease);transition-delay:calc(var(--i) * 38ms + .2s)}
.chart.in .bar .refl{opacity:.7}
.bar.peak i{background:linear-gradient(180deg,rgb(var(--accent)),rgb(var(--accent)/.5));box-shadow:0 0 26px rgb(var(--accent)/.55),0 0 2px rgb(var(--accent))}
.bar.peak .refl{background:linear-gradient(180deg,rgb(var(--accent)/.45),transparent)}
.bar.peak::before{content:"";position:absolute;bottom:-22px;left:50%;width:170px;height:44px;margin-left:-85px;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side,rgb(var(--accent)/.5),rgb(var(--accent)/.12) 55%,transparent);opacity:0;transition:opacity 1.2s var(--ease) .5s}
.chart.in .bar.peak::before{opacity:1}
.bar .xl{position:absolute;top:calc(100% + 11px);font-size:10.5px;color:var(--text-3);white-space:nowrap}
.bar.today .xl{color:var(--text);font-weight:600}
.bar .tip2{position:absolute;bottom:calc(var(--h) + 10px);padding:5px 9px;border-radius:8px;background:var(--toast-bg);color:var(--toast-fg);font-size:11px;font-weight:600;
  opacity:0;transform:translate3d(0,4px,0);transition:opacity .2s,transform .25s var(--ease);pointer-events:none;white-space:nowrap;z-index:3}
.bar:hover .tip2,.bar.peak .tip2{opacity:1;transform:none}
.bar:hover i{filter:brightness(1.35)}
.chart.in .bar.peak .tip2{transition-delay:.9s}
.toplist{display:grid;gap:14px}
.trow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px}
.trow .nm{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .pc{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.dots{grid-column:2/4;display:flex;gap:4px;margin-top:-6px}
.dots i{flex:1;max-width:12px;aspect-ratio:1;border-radius:50%;background:var(--line-2);transition:background .5s var(--ease),transform .5s var(--ease-s);transition-delay:calc(var(--i) * 45ms)}
.dots i.on{background:rgb(var(--c))}
.donut-wrap{display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;align-items:center}
.donut{position:relative;width:132px;height:132px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:13}
.donut .trk{stroke:var(--line)}
.donut .seg2{stroke-linecap:round;transition:stroke-dasharray 1.1s var(--ease),stroke-dashoffset 1.1s var(--ease)}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .ctr small{font-size:11px;color:var(--text-3)}
.donut .ctr b{font:600 20px/1.1 var(--font-d);letter-spacing:-.02em}
.legend{display:grid;gap:10px}
.legend div{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-2)}
.legend b{margin-left:auto;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;font-weight:500;color:var(--text-3);text-align:left;padding:0 8px 10px}
.tbl td{padding:10px 8px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl .site{display:flex;align-items:center;gap:10px;min-width:0}
.tbl .site b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .site small{display:block;font-size:11.5px;color:var(--text-3)}
.pbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:80px}
.pbar i{display:block;height:100%;width:var(--w);border-radius:inherit;background:linear-gradient(90deg,rgb(var(--accent)),rgb(var(--gb)));transform-origin:0 50%;animation:growX 1.1s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + .15s)}
@keyframes growX{from{transform:scaleX(0)}}
.prot-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.prot-row:first-of-type{border-top:0;padding-top:4px}
.prot-row .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line);color:var(--text-2);flex:none;transition:color .3s,background .3s,border-color .3s}
.prot-row .ic .i{width:16px;height:16px}
.prot-row.on .ic{color:rgb(var(--accent));background:rgb(var(--accent)/.1);border-color:rgb(var(--accent)/.25)}
.prot-row .tx{flex:1;min-width:0}
.prot-row .tx b{display:block;font-size:13px;font-weight:600}
.prot-row .tx span{display:block;font-size:11.5px;color:var(--text-3)}
.meter{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--card-2);border:1px solid var(--line)}
.meter .pbar{flex:1;height:8px}

/* --- История --- */
.hist-tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.hist-tools .search-in{flex:1;min-width:200px;max-width:340px}
.hist-closed{margin-bottom:18px}
.hist-cc-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hist-cc-h b{font:600 15px/1.2 var(--font-d);letter-spacing:-.015em}
.hist-cc-h .num{color:var(--text-3);font-size:12px;font-weight:600}
.hist-cc-t{display:flex;align-items:center;gap:7px;background:none;border:0;padding:2px 0;margin:0;color:inherit;font:inherit;cursor:pointer}
.hist-cc-t .chev{width:15px;height:15px;opacity:.65;transition:transform .18s var(--ease)}
.hist-cc-t[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.hist{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-month{flex:1;font:600 22px/1 var(--font-d);letter-spacing:-.025em;display:flex;align-items:baseline;gap:8px}
.cal-month span{color:var(--text-3);font-weight:400}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgb(var(--accent));color:#fff;box-shadow:0 8px 18px -10px rgb(var(--accent));transition:transform .2s var(--ease-s),filter .2s}
.cal-nav button:hover{filter:brightness(1.1);transform:translateY(-1px)}
.cal-nav button:active{transform:scale(.92)}
.cal-nav button .i{width:16px;height:16px;stroke-width:2}
.cal-dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:8px}
.cal-dows div{text-align:center;font-size:12.5px;font-weight:500;color:var(--text-2)}
.cal-dows div:nth-child(n+6){color:var(--text-3)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.cal.slide-l{animation:slideL .5s var(--ease) both}
.cal.slide-r{animation:slideR .5s var(--ease) both}
@keyframes slideL{from{opacity:0;transform:translate3d(24px,0,0)}}
@keyframes slideR{from{opacity:0;transform:translate3d(-24px,0,0)}}
.day{position:relative;min-height:84px;aspect-ratio:1.22;border-radius:15px;background:var(--card);border:1px solid var(--line);padding:9px 10px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:var(--hi);transition:transform .3s var(--ease),border-color .2s,box-shadow .3s}
.day:hover{transform:translate3d(0,-2px,0);border-color:var(--line-3)}
.day .heat{position:absolute;inset:0;background:rgb(var(--accent));opacity:calc(var(--heat,0) * .17);pointer-events:none}
.day .dn{position:relative;font-size:15px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.day .dc{position:absolute;top:10px;right:10px;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.day .dd{position:relative;display:flex;align-items:center;gap:4px;min-height:8px}
.day .dd i{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--dot-ring),0 0 0 1.5px var(--card)}
.day .dd em{font-style:normal;font-size:10.5px;color:var(--text-3);margin-left:3px}
.day .bars2{position:relative;display:flex;gap:3px;height:3px}
.day .bars2 span{height:100%;border-radius:3px;background:rgb(var(--c));opacity:.85}
.day.out{opacity:.34}
.day.future{opacity:.45;cursor:default}
.day.future:hover{transform:none;border-color:var(--line)}
.day.today{background:linear-gradient(145deg,rgb(var(--ga)),rgb(var(--gc)) 58%,rgb(var(--gb)));border-color:transparent;box-shadow:0 14px 30px -14px rgb(var(--gc)/.8)}
.day.today .heat{display:none}
.day.today .dn,.day.today .dc,.day.today em{color:#fff}
.day.today .dd i{box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.day.sel{border-color:rgb(var(--accent));box-shadow:0 0 0 1px rgb(var(--accent)),0 12px 26px -16px rgb(var(--accent))}
.day.today.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px rgb(var(--gc)),0 14px 30px -14px rgb(var(--gc)/.8)}
.cal.anim .day{animation:dayIn .55s var(--ease) both;animation-delay:calc(var(--i) * 11ms)}
@keyframes dayIn{from{opacity:0;transform:translate3d(0,10px,0) scale(.96)}}
.vis-panel{padding:16px 16px 8px;position:sticky;top:0}
.vis-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.vis-head .t{flex:1}
.vis-head b{display:block;font:600 16px/1.2 var(--font-d);letter-spacing:-.015em}
.vis-head span{font-size:12px;color:var(--text-3)}
.vis-list{max-height:calc(100vh - 290px);overflow:auto;margin:0 -8px;padding:0 8px}
.vis{position:relative;padding:13px 4px 13px;border-top:1px solid var(--line);cursor:pointer;border-radius:4px;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 30ms)}
.vis:first-child{border-top:0}
.vis:hover .vis-t{color:rgb(var(--accent))}
.vis-d{font-size:11.5px;color:rgb(var(--accent));font-weight:600;display:flex;align-items:center;gap:6px}
.vis-t{font-size:13.5px;font-weight:600;color:var(--text);margin:4px 30px 8px 0;line-height:1.3;transition:color .2s;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vis-m{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3)}
.vis-m .i{width:13px;height:13px}
.vis-m .du{margin-left:auto;color:var(--text-2);font-weight:500}
.vis .pbar{height:4px;margin-top:9px}
.vis .more{position:absolute;top:10px;right:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wcol{min-height:420px;border-radius:16px;background:var(--card);border:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcol.today{border-color:rgb(var(--accent)/.5);box-shadow:0 0 0 1px rgb(var(--accent)/.25)}
.wcol h4{display:flex;align-items:baseline;gap:6px;font-size:12px;font-weight:500;color:var(--text-3);padding:2px 4px 6px}
.wcol h4 b{font:600 18px/1 var(--font-d);color:var(--text)}
.wev{padding:7px 8px;border-radius:10px;background:var(--card-2);border-left:2px solid rgb(var(--c));font-size:11.5px;cursor:pointer;transition:background .2s,transform .2s var(--ease);min-width:0}
.wev:hover{background:var(--card-3);transform:translateX(2px)}
.wev small{display:block;color:var(--text-3);font-size:10.5px}
.wev span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.hlist-day{margin-bottom:18px}
.hlist-day h4{position:sticky;top:0;z-index:1;display:flex;align-items:baseline;gap:10px;padding:8px 4px;font:600 14px var(--font-d);background:var(--surface)}
.hlist-day h4 span{font:400 12px var(--font);color:var(--text-3)}
.hrow{display:grid;grid-template-columns:52px 26px minmax(0,1fr) auto 32px;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;cursor:pointer;transition:background .15s}
.hrow:hover{background:var(--hover)}
.hrow .tm{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.hrow .tt{min-width:0}
.hrow .tt b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .tt small{display:block;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .du{font-size:12px;color:var(--text-2)}
.hrow .icon-btn{opacity:0}
.hrow:hover .icon-btn{opacity:1}

/* --- Закладки --- */
.bm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.bm{position:relative;display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;
  transition:transform .35s var(--ease),border-color .25s,box-shadow .35s;box-shadow:var(--hi);text-align:left}
.bm:hover{transform:translate3d(0,-3px,0);border-color:var(--line-2);box-shadow:var(--sh-md)}
.bm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm small{display:block;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm .icon-btn{position:absolute;top:10px;right:10px;opacity:0}
.bm:hover .icon-btn{opacity:1}
.bm.add{align-items:center;justify-content:center;border-style:dashed;color:var(--text-3);min-height:118px}
.bm.add:hover{color:var(--text)}

.bm-tree{display:flex;flex-direction:column;gap:2px}
.bmt-folder-h{position:relative;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .15s;user-select:none}
.bmt-folder-h:hover{background:var(--hover)}
.bmt-folder-h .bmt-chevron{width:15px;height:15px;flex:none;color:var(--text-3);transition:transform .22s var(--ease)}
.bmt-folder.open>.bmt-folder-h .bmt-chevron{transform:rotate(90deg)}
.bmt-folder-h .bmt-fic{display:flex;flex:none;color:rgb(var(--accent))}
.bmt-folder-h b{font-size:13.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmt-folder-h small{font-size:11.5px;color:var(--text-3);flex:none}
.bmt-folder-h .icon-btn{opacity:0;flex:none}
.bmt-folder-h:hover .icon-btn{opacity:1}
.bmt-children{display:flex;flex-direction:column;gap:1px;margin:2px 0 4px 20px;padding-left:15px;border-left:1px solid var(--line);overflow:hidden;max-height:none}
.bmt-folder:not(.open)>.bmt-children{display:none}
.bmt-item{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:11px;cursor:pointer;transition:background .15s}
.bmt-item:hover{background:var(--hover)}
.bmt-item .tt{min-width:0;flex:1}
.bmt-item .tt b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmt-item .tt small{display:block;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmt-item .icon-btn{opacity:0;flex:none}
.bmt-item:hover .icon-btn{opacity:1}
.bmf-pop{width:250px}
.bmf-list{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 10px}
.bmf-chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);font-size:12.5px;color:var(--text-2);cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.bmf-chip:hover{background:var(--hover);color:var(--text)}
.bmf-chip.on{background:rgb(var(--accent)/.15);border-color:rgb(var(--accent)/.5);color:rgb(var(--accent))}
.bmf-chip .i{width:14px;height:14px}
.bmf-new{display:flex;gap:6px}
.bmf-new .input{flex:1;height:32px}
.bmf-new .btn{flex:none}

/* --- Мессенджер --- */
.msg{position:absolute;inset:0;display:grid;grid-template-columns:320px minmax(0,1fr)}
.msg-side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.msg-sh{padding:18px 16px 12px;display:flex;flex-direction:column;gap:12px}
.msg-sh .row{display:flex;align-items:center;gap:8px}
.msg-sh h2{flex:1;font:600 20px/1 var(--font-d);letter-spacing:-.02em}
.me-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--text-3)}
.me-card b{display:block;font-size:13px;color:var(--text)}
.me-card .chip{margin-left:auto}
.chats{flex:1;overflow:auto;padding:4px 8px 10px}
.chat-i{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;cursor:pointer;width:100%;text-align:left;transition:background .15s}
.chat-i:hover{background:var(--hover)}
.chat-i.on{background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2),var(--hi)}
.av{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;position:relative}
.av.sm{width:36px;height:36px;border-radius:12px;font-size:13px}
.av .on-dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:rgb(var(--ok));box-shadow:0 0 0 2.5px var(--surface)}
.chat-i .tx{flex:1;min-width:0}
.chat-i .tx b{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
.chat-i .tx b .tm{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:400}
.chat-i .tx span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);margin-top:2px}
.chat-i .tx span em{font-style:normal;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-main{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface)}
.msg-mh{display:flex;align-items:center;gap:12px;height:66px;padding:0 16px 0 20px;border-bottom:1px solid var(--line);flex:none}
.msg-mh .tx{flex:1;min-width:0}
.msg-mh .tx b{display:block;font-size:14.5px;font-weight:600}
.msg-mh .tx span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.msg-body{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:6px}
.msg-sys{align-self:center;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);margin:4px 0 10px}
.msg-sys .i{width:13px;height:13px}
.bub{max-width:min(520px,72%);padding:9px 13px 7px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:13.5px;line-height:1.45;align-self:flex-start;border-bottom-left-radius:6px;animation:bubIn .38s var(--ease) both;color:var(--text)}
.bub.me{align-self:flex-end;background:linear-gradient(140deg,rgb(var(--accent)/.95),rgb(var(--gb)/.9));color:#fff;border-color:transparent;border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.bub .tm{display:block;text-align:right;font-size:10.5px;opacity:.6;margin-top:2px}
@keyframes bubIn{from{opacity:0;transform:translate3d(0,8px,0) scale(.98)}}
.voice{display:flex;align-items:center;gap:10px;min-width:220px}
.voice .pl{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);flex:none}
.bub:not(.me) .voice .pl{background:rgb(var(--accent));color:#fff}
.voice .pl .i{width:14px;height:14px}
.voice .wf{flex:1;display:flex;align-items:center;gap:2px;height:26px}
.voice .wf i{flex:1;border-radius:2px;background:currentColor;opacity:.55;height:var(--h)}
.circle-v{width:190px;height:190px;border-radius:50%;position:relative;overflow:hidden;align-self:flex-end;background:conic-gradient(from 120deg,rgb(var(--ga)),rgb(var(--gc)),rgb(var(--gb)),rgb(var(--ga)));padding:3px;animation:bubIn .4s var(--ease) both}
.circle-v div{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3d48,#101116);display:grid;place-items:center;color:#fff}
.circle-v .i{width:28px;height:28px}
.circle-v small{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:99px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:12px 16px 16px;flex:none}
.composer .box{flex:1;display:flex;align-items:flex-end;gap:6px;padding:6px 6px 6px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line-2);transition:border-color .2s,box-shadow .2s}
.composer .box:focus-within{border-color:rgb(var(--accent)/.45);box-shadow:0 0 0 4px rgb(var(--accent)/.08)}
.composer textarea{flex:1;resize:none;background:none;border:0;outline:0;font-size:13.5px;line-height:1.45;padding:7px 0;max-height:120px;color:var(--text)}
.composer textarea::placeholder{color:var(--text-3)}
.rec{display:flex;align-items:center;gap:10px;flex:1;padding:9px 0;font-size:13px;color:rgb(var(--danger))}
.rec i{width:9px;height:9px;border-radius:50%;background:rgb(var(--danger));animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.call{position:fixed;inset:0;z-index:180;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;
  background:radial-gradient(600px 400px at 30% 30%,rgb(var(--ga)/.35),transparent 70%),radial-gradient(600px 400px at 70% 70%,rgb(var(--gb)/.35),transparent 70%),#07070A;animation:fadeIn .35s ease both}
.call .av{width:120px;height:120px;border-radius:40px;font-size:40px}
.call .av::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid rgba(255,255,255,.35);animation:ring 2s ease-out infinite}
.call .av .i{width:44px;height:44px}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.5);opacity:0}}
.call h2{font:600 26px var(--font-d);letter-spacing:-.02em}
.call p{color:rgba(255,255,255,.6);font-size:14px}
.call .ctrls{display:flex;gap:14px;margin-top:26px}
.call .ctrls button{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;transition:background .2s,transform .2s var(--ease-s)}
.call .ctrls button:hover{background:rgba(255,255,255,.2);transform:scale(1.06)}
.call .ctrls button.off{background:#fff;color:#111}
.call .ctrls button.end{background:#FF4D4F}
.call .ctrls .i{width:22px;height:22px}

/* --- Задачи --- */
.tf-kind{width:100%}
.tf-kind button{flex:1;justify-content:center}
.tf-qm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf-qm button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.tf-qm button b{font-size:12.5px;font-weight:600}
.tf-qm button small{font-size:11px;color:var(--text-3)}
.tf-qm button:hover{background:var(--card-3)}
.tf-qm button.on{border-color:var(--qc);box-shadow:0 0 0 1px var(--qc) inset;background:var(--card-3)}
.tf-qm button.on b{color:var(--qc)}
.tk-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.tk-bar .search-in{flex:1;min-width:180px;max-width:300px}
.tk-bar .select{width:auto;min-width:150px}
.tk-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tk-stat{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--hi)}
.tk-stat small{font-size:12px;color:var(--text-3)}
.tk-stat b{display:block;font:500 26px/1.1 var(--font-d);letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.tk-list{border-radius:20px;background:var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:var(--hi)}
.tk-head,.tk{display:grid;grid-template-columns:34px minmax(0,2.3fr) minmax(0,1.1fr) 118px 112px minmax(0,1.3fr) 118px 92px;align-items:center;gap:12px;padding:0 14px}
.tk-head{height:40px;font-size:11.5px;color:var(--text-3);font-weight:500;border-bottom:1px solid var(--line)}
.tk-head>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .prio{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tk{min-height:56px;border-top:1px solid var(--line);transition:background .15s;animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0) * 30ms)}
.tk:first-of-type{border-top:0}
.tk:hover{background:var(--hover)}
.tk .tt{min-width:0;cursor:pointer}
.tk .tt b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .tt small{display:block;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk.done .tt b{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-4)}
.tk .cell{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .cell.over{color:rgb(var(--danger));font-weight:500}
.tk .acts{display:flex;justify-content:flex-end;gap:2px;opacity:0;transition:opacity .15s}
.tk:hover .acts{opacity:1}
.cbx{width:20px;height:20px;border-radius:7px;border:1.5px solid var(--line-3);display:grid;place-items:center;color:#fff;transition:background .25s var(--ease),border-color .25s,transform .2s var(--ease-s)}
.cbx .i{width:12px;height:12px;stroke-width:3;opacity:0;transform:scale(.5);transition:opacity .2s,transform .3s var(--ease-s)}
.cbx:hover{border-color:rgb(var(--accent))}
.cbx.on{background:rgb(var(--accent));border-color:rgb(var(--accent))}
.cbx.on .i{opacity:1;transform:none}
.cbx:active{transform:scale(.88)}
/* 1.0.149: «Удалить данные просмотра» — диалог и окно-итог */
.cbd-range{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cbd-range span{font-size:13px;color:var(--text-2);white-space:nowrap}
.cbd-range .select{width:auto;min-width:190px;flex:none}
.cbd-list{display:flex;flex-direction:column;gap:1px}
.cbd-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--text);user-select:none}
.cbd-row:hover{background:var(--card-2)}
.cbd-row.child{padding-left:30px}
.cbd-row .cbx{flex:none;pointer-events:none}
.cbd-l{line-height:1.35}
.cbd-res{display:flex;flex-direction:column;margin:2px 0 6px}
.cbd-res-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:13px;padding:7px 2px;border-bottom:1px dashed var(--line)}
.cbd-res-row:last-child{border-bottom:0}
.cbd-res-row .k{color:var(--text)}
.cbd-res-row .v{color:var(--text-2);text-align:right;white-space:nowrap;flex:none}
.cbd-note{font-size:11.5px;color:var(--text-3);line-height:1.5;margin:8px 0 0}
.modal .mi-ic.cbd-ok{background:rgb(var(--accent)/.1);border-color:rgb(var(--accent)/.28);color:rgb(var(--accent))}
.prio{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.eisen{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eq{border-radius:18px;background:var(--card);border:1px solid var(--line);padding:14px;min-height:220px;box-shadow:var(--hi)}
.eq h4{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:10px}
.eq h4 small{margin-left:auto;font-weight:400;color:var(--text-3)}
.eq .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:var(--card-2);margin-top:6px;font-size:12.5px;cursor:pointer;transition:background .15s}
.eq .it:hover{background:var(--card-3)}
.eq .it span{flex:1;min-width:0;white-space:normal;overflow-wrap:break-word}

/* --- Списки (загрузки, пароли, расширения) --- */
.rows{border-radius:20px;background:var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:var(--hi)}
.lrow{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line);animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms);transition:background .15s}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--hover)}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .tx small{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);margin-top:2px}
.lrow .acts{display:flex;align-items:center;gap:4px}
.lrow .pbar{margin-top:8px;max-width:360px}
.file-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.03em;color:#fff;flex:none}
.pw{font-family:var(--mono);font-size:12.5px;color:var(--text-2);letter-spacing:.06em;min-width:120px}
.banner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;margin-bottom:16px;background:linear-gradient(135deg,rgb(var(--ok)/.1),transparent 70%),var(--card);border:1px solid rgb(var(--ok)/.2)}
.banner .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgb(var(--ok)/.14);color:rgb(var(--ok));flex:none}
.banner .tx{flex:1}
.banner b{display:block;font-size:14px}
.banner span{font-size:12.5px;color:var(--text-3)}
.ext-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ext{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--hi);transition:border-color .25s,transform .35s var(--ease)}
.ext:hover{border-color:var(--line-2);transform:translate3d(0,-2px,0)}
.ext .top{display:flex;align-items:center;gap:12px}
.ext .top .tx{flex:1;min-width:0}
.ext .top b{display:block;font-size:14px}
.ext .top small{font-size:12px;color:var(--text-3)}
.ext p{font-size:12.5px;color:var(--text-2);line-height:1.5;min-height:38px}
.ext .ft{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
.ext .ft .sp{flex:1}
.ext .ft .mono-dim{font-family:var(--font-m,ui-monospace,monospace);font-size:11px;color:var(--text-4,var(--text-3));opacity:.8;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.ext-state{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;flex:none;
  background:rgb(var(--ok)/.12);color:rgb(var(--ok));font-size:10.5px;font-weight:650;letter-spacing:.02em}
.ext-state .i{width:12px;height:12px}
.ext-store{display:flex;flex-direction:column;gap:14px;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--hi)}
.es-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.es-row .wg-ic{width:34px;height:34px;border-radius:11px}
.es-row .tx{flex:1;min-width:200px}
.es-row .tx b{display:block;font-size:13.5px}
.es-row .tx small{display:block;margin-top:2px;color:var(--text-3);font-size:11.5px}
.es-row .input{width:auto;flex:1;min-width:220px}
.sec-t{font:600 15px var(--font-d);letter-spacing:-.01em;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec-t:first-child{margin-top:0}
.sec-t small{font:400 12px var(--font);color:var(--text-3)}

/* --- Сертификаты --- */
.chain{display:grid;gap:10px}
.cert{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);position:relative}
.cert+.cert::before{content:"";position:absolute;left:35px;top:-11px;height:10px;width:1.5px;background:var(--line-3)}
.cert .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgb(var(--info)/.12);color:rgb(var(--info));flex:none}
.cert .tx{flex:1;min-width:0}
.cert b{display:block;font-size:13.5px}
.cert small{font-size:12px;color:var(--text-3)}

/* --- Сайт / поиск / AI-ассистент (макеты) --- */
.sitepg{max-width:880px;margin:0 auto;padding:54px 34px 60px}
.site-card{padding:28px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-md);position:relative;overflow:hidden}
.site-card::before{content:"";position:absolute;right:-160px;top:-180px;width:460px;height:380px;border-radius:50%;background:radial-gradient(closest-side,rgb(var(--c,var(--accent))/.2),transparent);pointer-events:none}
.site-top{display:flex;align-items:center;gap:16px;position:relative}
.site-top .fav{width:56px;height:56px;border-radius:17px;font-size:22px}
.site-top h1{font:600 26px/1.15 var(--font-d);letter-spacing:-.025em}
.site-top p{color:var(--text-3);font-size:13px;margin-top:4px}
.site-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0;position:relative}
.site-stats div{padding:12px 14px;border-radius:14px;background:var(--card-2);border:1px solid var(--line)}
.site-stats small{display:block;font-size:11.5px;color:var(--text-3)}
.site-stats b{display:block;font:500 20px/1.2 var(--font-d);margin-top:4px;font-variant-numeric:tabular-nums}
.skel{display:grid;gap:10px;margin-top:6px}
.skel i{position:relative;display:block;height:12px;border-radius:6px;background:var(--card-2);overflow:hidden}
.skel i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--card-3),transparent);transform:translate3d(-100%,0,0);animation:shimmer 1.8s var(--ease-io) infinite}
@keyframes shimmer{to{transform:translate3d(100%,0,0)}}
.site-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;position:relative}
.think{display:flex;align-items:center;gap:6px}
.think i{width:7px;height:7px;border-radius:50%;background:rgb(var(--gc));animation:think 1.2s ease-in-out infinite}
.think i:nth-child(2){animation-delay:.15s;background:rgb(var(--ga))}
.think i:nth-child(3){animation-delay:.3s;background:rgb(var(--gb))}
@keyframes think{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}

/* --- Настройки --- */
.settings{width:min(960px,100%);height:min(680px,calc(100vh - 48px));display:grid;grid-template-columns:230px minmax(0,1fr);background:var(--card);border:1px solid var(--line-2);border-radius:24px;box-shadow:var(--sh-lg);overflow:hidden;animation:modalIn .45s var(--ease) both}
.set-nav{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface);overflow:auto}
.set-nav h3{font:600 18px var(--font-d);letter-spacing:-.02em;padding:0 10px 12px}
.set-nav .search-in{margin:0 2px 10px}
.set-nav button{display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border-radius:10px;font-size:13px;color:var(--text-2);text-align:left;transition:background .15s,color .15s}
.set-nav button:hover{background:var(--hover);color:var(--text)}
.set-nav button.on{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2),var(--hi)}
.set-nav button .i{width:16px;height:16px}
.set-body{overflow:auto;padding:22px 28px 40px;position:relative;scroll-behavior:smooth}
.set-pane{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.set-head{min-height:60px;background:var(--card)}
.set-close{position:absolute;top:13px;right:15px;z-index:5;width:34px;height:34px;border-radius:11px;background:transparent;border:1px solid transparent;color:var(--text-3)}
.set-close:hover{background:var(--hover);border-color:var(--line-2);color:var(--text)}
.set-close:active{transform:scale(.94)}
.set-sec{margin-bottom:30px}
.set-sec h4{font:600 16px var(--font-d);letter-spacing:-.015em;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.set-card{border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.set-card > .font-demo{margin:14px 16px 6px}
.uiscale{display:flex;align-items:center;gap:8px}
.font-demo{display:flex;flex-direction:column;gap:9px;padding:14px 16px;border:1px solid var(--line-2);border-radius:14px;background:var(--card-2);margin-bottom:14px;overflow:hidden}
.fd-d{font-family:var(--font-d);font-size:calc(22px*var(--uif,1)*var(--uif-d,1));font-weight:600;letter-spacing:-.02em;color:var(--text)}
.fd-i{font-family:var(--font);font-size:calc(13px*var(--uif,1)*var(--uif-i,1));color:var(--text-2)}
.fd-m{font-family:var(--mono);font-size:calc(12px*var(--uif,1)*var(--uif-m,1));color:var(--text-3);word-break:break-all}
[data-fscale-ctl]{gap:8px}
.uiscale-r{-webkit-appearance:none;appearance:none;width:170px;height:24px;background:transparent;outline:none;margin:0}
.uiscale-r::-webkit-slider-runnable-track{height:5px;border-radius:4px;background:var(--card-3)}
.uiscale-r::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:rgb(var(--accent));border:2px solid var(--card);cursor:pointer;margin-top:-5px}
.fscale-r{-webkit-appearance:none;appearance:none;min-width:120px;height:24px;background:transparent;outline:none;margin:0}
.fscale-r::-webkit-slider-runnable-track{height:5px;border-radius:4px;background:var(--card-3)}
.fscale-r::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:rgb(var(--accent));border:2px solid var(--card);cursor:pointer;margin-top:-5.5px}
.uiscale-v{min-width:52px;text-align:right;font-size:12px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}
.set-row{display:flex;align-items:center;gap:16px;padding:13px 16px;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.set-row .tx{flex:1;min-width:0}
.set-row .tx b{display:block;font-size:13.5px;font-weight:500}
.set-row .tx span{display:block;font-size:12px;color:var(--text-3);margin-top:2px}
.set-row .select{width:auto;min-width:180px}
.theme-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tcard{border-radius:16px;border:1px solid var(--line-2);padding:8px;background:var(--card);text-align:left;transition:border-color .25s,transform .3s var(--ease),box-shadow .3s}
.tcard:hover{transform:translate3d(0,-2px,0)}
.tcard.on{border-color:rgb(var(--accent));box-shadow:0 0 0 1px rgb(var(--accent))}
.tprev{height:78px;border-radius:11px;position:relative;overflow:hidden;display:grid;place-items:center;background:var(--p-bg)}
.tprev::before,.tprev::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;filter:blur(18px);opacity:.75}
.tprev::before{left:6%;top:18%;background:var(--p-a)}
.tprev::after{right:6%;bottom:0;background:var(--p-b)}
.tprev i{position:relative;z-index:1;width:72%;height:24px;border-radius:8px;background:var(--p-bar);box-shadow:0 0 0 1px rgba(128,128,128,.25)}
.tcard b{display:block;font-size:12.5px;font-weight:600;margin:8px 4px 0}
.tcard small{display:block;font-size:11px;color:var(--text-3);margin:0 4px 2px}
.kbd-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.kbd-grid div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--text-2)}

.profile-hero{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);align-items:center;gap:22px;padding:21px 23px;border:1px solid var(--line-2);border-radius:22px;background:linear-gradient(112deg,color-mix(in srgb,var(--card) 84%,rgb(var(--gc)/.13)),var(--card) 58%,color-mix(in srgb,var(--card) 88%,rgb(var(--gb)/.13)));box-shadow:var(--hi)}
.profile-hero::before{content:"";position:absolute;z-index:0;pointer-events:none;width:360px;height:250px;left:12%;top:-155px;border-radius:50%;background:radial-gradient(closest-side,rgb(var(--gc)/.20),transparent 74%);filter:blur(10px)}
.profile-hero::after{content:"";position:absolute;z-index:0;pointer-events:none;width:300px;height:220px;right:8%;bottom:-150px;border-radius:50%;background:radial-gradient(closest-side,rgb(var(--gb)/.16),transparent 72%);filter:blur(12px)}
.profile-id,.profile-promise{position:relative;z-index:1;min-width:0;display:flex;align-items:center;gap:16px}
.profile-avatar{position:relative;isolation:isolate;display:grid;place-items:center;flex:none;width:68px;height:68px;border:1px solid rgb(var(--gc)/.34);border-radius:21px;background:radial-gradient(circle at 25% 18%,rgba(255,255,255,.26),transparent 42%),linear-gradient(140deg,rgb(var(--ga)/.92),rgb(var(--gc)/.90) 58%,rgb(var(--gb)/.92));box-shadow:0 12px 34px -18px rgb(var(--gc)/.75),inset 0 1px 0 rgba(255,255,255,.32);color:var(--avatar-fg,#fff);font:650 22px/1 var(--font-d);letter-spacing:-.04em}
.profile-avatar::before{content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.25);border-radius:16px;pointer-events:none}
.profile-avatar>i{position:absolute;right:-5px;bottom:-5px;width:24px;height:24px;display:grid;place-items:center;border:2px solid var(--card);border-radius:9px;background:linear-gradient(135deg,rgb(var(--gc)),rgb(var(--gb)));color:var(--avatar-fg,#fff);box-shadow:0 4px 12px rgb(var(--gc)/.45)}

.profile-promise-icon{width:37px;height:37px;display:grid;place-items:center;flex:none;border:1px solid rgb(var(--ok)/.2);border-radius:12px;background:rgb(var(--ok)/.09);color:rgb(var(--ok));box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

.ach-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.ach-card{--ach-rgb:141 140 255;position:relative;isolation:isolate;overflow:hidden;min-width:0;min-height:188px;display:flex;flex-direction:column;padding:14px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,rgb(var(--ach-rgb)/.045),var(--card) 58%);box-shadow:var(--hi);color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s,background .2s}

/* =========================================================================
   SHELTER · PREMIUM GLASS — редизайн интерфейса (слой поверх базовой темы)
   -------------------------------------------------------------------------
   Ниже переопределяется ТОЛЬКО внешний вид каркаса браузера и внутренних
   страниц через уже существующие цветовые переменные темы (--card, --line,
   --accent, --ga/--gb/--gc, --ok/--warn/--danger/--info и т.д.) — палитра
   четырёх тем и её значения нигде не меняются.
   Экспресс-панель (.hero, .omni, .hero-links, орбы/глифы) и глобальный
   .ambient — не затрагиваются ни одним селектором ниже.

   ПРОИЗВОДИТЕЛЬНОСТЬ: backdrop-filter (размытие фона) — самая дорогая для
   GPU/CPU операция композитинга, и её стоимость растёт с числом элементов,
   на которых она включена одновременно. Поэтому blur оставлен только на
   одиночных «хромовых» поверхностях (сайдбар, адресная строка, модалки,
   меню, палитра, тултип, тост) — там, где на экране всегда 0-1 такой
   элемент. На плитках/карточках/строках/чипах/кнопках, которых на экране
   могут быть десятки одновременно (сетка ачивок, календарь, список тегов,
   сообщения чата), blur снят — визуальный эффект «стекла» сохраняется за
   счёт полупрозрачного цвета (color-mix), градиента и тени, без дорогого
   постоянного размытия фона под каждым элементом.
   ========================================================================= */

/* ---------- 0 · Токены стекла и премиальных теней ---------- */
:root{
  --glass-op: 82; /* регулируется ползунком «Прозрачность интерфейса» в панели «Анимации и вкладки» */
  --glass-1: color-mix(in srgb, var(--card) calc(var(--glass-op) * 1%), transparent);
  --glass-2: color-mix(in srgb, var(--card-2) calc(var(--glass-op) * 0.95 * 1%), transparent);
  --glass-3: color-mix(in srgb, var(--card-3) calc(var(--glass-op) * 0.9 * 1%), transparent);
  --glass-solid: color-mix(in srgb, var(--card) calc(var(--glass-op) * 1.16 * 1%), transparent);
  --glass-menu: color-mix(in srgb, var(--menu) calc(var(--glass-op) * 1.05 * 1%), transparent);
  --glass-sb: color-mix(in srgb, var(--surface) calc(var(--glass-op) * 0.85 * 1%), transparent);
  --glass-surface: color-mix(in srgb, var(--surface) calc(var(--glass-op) * 1.1 * 1%), transparent);
  --glass-border: color-mix(in srgb, var(--line-2) 100%, transparent);
  --glass-border-soft: color-mix(in srgb, var(--line) 100%, transparent);
  --glow-ring: 0 0 0 1px rgb(var(--accent)/.16);
  --glow-soft: 0 18px 42px -22px rgb(var(--accent)/.52);
  --glow-lift: var(--hi), var(--sh-md);
  --glow-lift-lg: var(--hi), var(--sh-lg);
  --glow-lift-sm: var(--hi), var(--sh-sm);
  --r-xl: 26px; --r-l: 20px; --r-m: 16px; --r-s: 12px; --r-xs: 9px;
  --bf-glass: blur(18px) saturate(160%);
  --bf-menu: blur(22px) saturate(170%);
}
body[data-gfx="balance"]{
  --bf-glass:none !important;
  --bf-menu:none !important;
}
body[data-gfx="balance"] *,
body[data-gfx="balance"] *::before,
body[data-gfx="balance"] *::after{
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
}
body[data-gfx="perf"]{
  --bf-glass:none !important;
  --bf-menu:none !important;
  --glass-op:100 !important;
  --glass-1:var(--card) !important;
  --glass-2:var(--card-2) !important;
  --glass-3:var(--card-3) !important;
  --glass-solid:var(--card) !important;
  --glass-menu:var(--menu) !important;
  --glass-sb:var(--surface) !important;
  --glass-surface:var(--surface) !important;
  --glass-border:var(--line-2) !important;
  --glass-border-soft:var(--line) !important;
  --bar:var(--surface) !important;
  --bar-line:var(--line-2) !important;
  --pill:var(--card-2) !important;
  --pill-line:var(--line-2) !important;
  --active:var(--card-2) !important;
  --hero-lift:var(--hero) !important;
  --scrim:var(--bg) !important;
  --sh-sm:none !important;
  --sh-md:none !important;
  --sh-lg:none !important;
  --hi:none !important;
  --glow-ring:none !important;
  --glow-soft:none !important;
  --glow-lift:none !important;
  --glow-lift-lg:none !important;
  --glow-lift-sm:none !important;
}
body.glow-off .ambient,
body.glow-off #heroFx{display:none !important;visibility:hidden !important}
body.glow-off .ambient i{animation:none !important}
body.glow-off .hero::before,
body.glow-off .pdot::after{display:none !important;animation:none !important}
body[data-gfx="balance"] .ambient i,
body[data-gfx="balance"] .orb.halo>i,
body[data-gfx="balance"] .orb.core>i,
body[data-gfx="balance"] .pdot::after{animation:none !important}

/* ---------- 1 · Каркас: боковая панель ---------- */
.sb{
  margin:0;
  border-radius:0;
  /* фон гаснет до полной прозрачности к правому краю — там, где панель граничит с тулбаром/сценой,
     цвет должен на 100% совпадать с фоном страницы, иначе виден шов (см. фикс «нет разделения») */
  background:linear-gradient(in srgb 100deg, var(--glass-2) 0%, var(--glass-sb) 20%, transparent 42%);
  /* backdrop-filter умышленно не ставим на весь блок: даже при alpha=0 фильтр создаёт свой
     композитный слой с чёткой границей ровно по краю панели — сам шов, с которым боремся.
     Блюр остаётся точечно на дочерних элементах (.sb-search, .nav-ind и т.д.) */
}
.sb::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(140% 60% at 15% -10%, rgb(var(--gc)/.08), transparent 60%);
}
.sb-top,.brand,.sb-sep,.sb-search,.sb-pin,.sb-scroll,.sb-bottom{ position:relative; z-index:1; }
.sb-search{
  background:var(--glass-1); border:1px solid var(--glass-border-soft);
  box-shadow:var(--hi); backdrop-filter:var(--bf-glass);
  transition:border-color .25s,color .25s,background .25s,box-shadow .25s;
}
.sb-search:hover{ background:var(--glass-2); box-shadow:var(--hi), 0 8px 22px -16px rgba(0,0,0,.35); }
.ni{ border-radius:var(--r-s); }
.ni:hover{ background:color-mix(in srgb, var(--hover) 100%, transparent); }
.nav-ind{
  border-radius:var(--r-s);
  background:linear-gradient(180deg, color-mix(in srgb, var(--card-2) 88%, transparent), color-mix(in srgb, var(--card) 88%, transparent));
  box-shadow:var(--hi), var(--sh-sm), 0 4px 14px -10px rgb(var(--glow-rgb,var(--ga)) / var(--glow-sh-a,.12));
  backdrop-filter:var(--bf-glass);
  transition:transform .5s var(--ease),opacity .3s var(--ease),box-shadow .4s var(--ease);
}
.nav-ind::before{
  background:radial-gradient(110px 34px at 0% 50%, rgb(var(--glow-rgb,var(--accent)) / var(--glow-spot-a,.04)), transparent 72%);
}
.ni.active .i{ color:rgb(var(--glow-rgb,var(--ga))); filter:drop-shadow(0 0 5px rgb(var(--glow-rgb,var(--ga)) / var(--glow-sh-a,.14))); transition:color .3s var(--ease),filter .3s var(--ease); }
.tab{ border-radius:var(--r-s); }
.tab.active{
  background:linear-gradient(180deg, color-mix(in srgb, var(--card-2) 92%, transparent), color-mix(in srgb, var(--card) 92%, transparent));
  box-shadow:var(--hi), var(--sh-sm), 0 4px 14px -10px rgb(var(--glow-rgb,var(--ga)) / var(--glow-sh-a,.12));
}
.space-btn:hover{ background:var(--glass-2); }
.icon-btn:hover{ background:var(--glass-2); box-shadow:0 4px 12px -8px rgb(var(--glow-rgb,var(--ga)) / var(--glow-sh-a,.14)); }
.user{
  background:var(--glass-1); border:1px solid var(--glass-border-soft);
  box-shadow:var(--hi); backdrop-filter:var(--bf-glass);
  transition:background .25s,border-color .25s,box-shadow .25s,transform .3s var(--ease);
}
.user:hover{ background:var(--glass-2); box-shadow:var(--hi), 0 10px 26px -16px rgba(0,0,0,.4); transform:translate3d(0,-1px,0); }
.ni.boxed{ background:var(--glass-1); }
.ni.boxed:hover{ background:var(--glass-2); }
.swatches{ background:var(--glass-1); }
.theme-mini{ background:var(--glass-1); }

@media (max-width:720px){
  .sb{ box-shadow:var(--sh-lg); }
}

/* ---------- 2 · Верхняя панель и адресная строка (не hero) ---------- */
.tb{ position:relative; z-index:5; }
.tb-btn:hover, .tb-btn.on{ background:var(--glass-2); }
.tb-ctls .ctl:hover, .tb-ctls .ctl.on{ background:var(--glass-2); }
.ctl{ background:var(--glass-1); border:1px solid var(--glass-border-soft); box-shadow:var(--hi); }
.ctl.on{ box-shadow:var(--hi), 0 0 16px -4px rgb(var(--accent)/.5); }
#omniTb.omni-tb{
  background:var(--glass-1);
  border:1px solid var(--glass-border-soft);
  box-shadow:var(--hi), var(--sh-sm);
  backdrop-filter:var(--bf-glass);
  transition:border-color .3s,box-shadow .3s,background .3s;
}
#omniTb.omni-tb:hover{ border-color:var(--line-2); }
#omniTb.omni-tb.focus{
  background:var(--glass-solid);
  box-shadow:var(--hi), 0 0 0 4px rgb(var(--accent)/.12), var(--glow-soft);
}
.tb-pill{ background:var(--glass-2); border:1px solid var(--glass-border-soft); backdrop-filter:var(--bf-glass); box-shadow:var(--hi); }
.tb-pill:hover{ background:var(--glass-3); }
.ext-ico:hover{ background:var(--glass-2); }
#tbSuggest.suggest{
  background:var(--glass-menu); border:1px solid var(--glass-border);
  box-shadow:var(--glow-lift-lg); backdrop-filter:var(--bf-menu);
}

/* ---------- 3 · Сцена (рамка контента) ---------- */
.stage{
  border-radius:var(--r-xl);
  background:linear-gradient(180deg, color-mix(in srgb, var(--surface) 97%, transparent), var(--surface) 60%);
  border:1px solid var(--glass-border-soft);
  box-shadow:var(--glow-lift-lg);
}
/* Сцена примыкает вплотную к боковой панели без шва: цвет фона у сайдбара и сцены
   теперь идентичен (см. .sb), поэтому скруглённые углы слева не создают видимого разрыва —
   можно вернуть скругление на все 4 угла, оставив только левую грань без обводки
   (только пока сайдбар статично стоит рядом, т.е. на широких экранах). */
@media (min-width:721px){
  .stage{ border-radius:var(--r-xl); border-left:none; }
}
.stage[data-device] .viewport{ box-shadow:var(--sh-lg), 0 0 0 1px var(--glass-border); }
.findbar{
  background:var(--glass-menu); border:1px solid var(--glass-border);
  box-shadow:var(--glow-lift-lg); backdrop-filter:var(--bf-menu);
}
.devtools{
  background:var(--glass-solid); backdrop-filter:var(--bf-menu);
  border-top:1px solid var(--glass-border);
}

/* ---------- 4 · Кнопки, поля, переключатели — единый язык (без рывков и конфликтов) ---------- */
.btn{
  border-radius:var(--r-s);
  background:var(--glass-2);
  border:1px solid var(--glass-border-soft);
  color:var(--text);
  box-shadow:var(--hi);
  position:relative; isolation:isolate;
  transition:background-color .22s var(--ease),border-color .22s var(--ease),transform .16s var(--ease),box-shadow .26s var(--ease),color .2s var(--ease),filter .22s var(--ease);
}
.btn:hover{
  background:var(--glass-3);
  border-color:var(--line-3);
  color:var(--text);
  box-shadow:var(--hi), 0 8px 22px -12px rgb(var(--accent)/.32), 0 4px 12px -6px rgba(0,0,0,.28);
}
.btn.primary{
  background:var(--text);
  color:var(--surface);
  border-color:transparent;
  box-shadow:var(--sh-sm), inset 0 1px 0 rgba(255,255,255,.16);
}
.btn.primary:hover{
  background:var(--text);
  color:var(--surface);
  border-color:transparent;
  filter:brightness(1.06);
  box-shadow:var(--sh-md), 0 0 20px -4px rgb(var(--accent)/.38), inset 0 1px 0 rgba(255,255,255,.22);
}
.btn.accent{
  background:linear-gradient(135deg,rgb(var(--ga)),rgb(var(--gc)) 55%,rgb(var(--gb)));
  color:#fff;
  border-color:transparent;
  box-shadow:0 12px 26px -12px rgb(var(--gc)/.65), inset 0 1px 0 rgba(255,255,255,.3);
}
.btn.accent:hover{
  background:linear-gradient(135deg,rgb(var(--ga)),rgb(var(--gc)) 55%,rgb(var(--gb)));
  color:#fff;
  border-color:transparent;
  filter:brightness(1.06);
  box-shadow:0 16px 34px -10px rgb(var(--gc)/.78), inset 0 1px 0 rgba(255,255,255,.36);
}
.btn.ghost{
  background:transparent;
  border-color:transparent;
  color:var(--text-2);
  box-shadow:none;
}
.btn.ghost:hover{
  background:var(--glass-2);
  border-color:var(--glass-border-soft);
  color:var(--text);
  box-shadow:var(--hi);
}
.btn.danger{
  color:rgb(var(--danger));
}
.btn.danger:hover{
  background:rgb(var(--danger)/.1);
  border-color:rgb(var(--danger)/.28);
  color:rgb(var(--danger));
  box-shadow:0 8px 20px -12px rgb(var(--danger)/.35);
}
.btn.danger.solid{
  background:rgb(var(--danger));
  color:#fff;
  border-color:transparent;
  box-shadow:0 12px 24px -14px rgb(var(--danger)/.6), inset 0 1px 0 rgba(255,255,255,.2);
}
.btn.danger.solid:hover{
  background:rgb(var(--danger));
  color:#fff;
  border-color:transparent;
  filter:brightness(1.06);
  box-shadow:0 16px 30px -12px rgb(var(--danger)/.75), inset 0 1px 0 rgba(255,255,255,.26);
}
.btn.premium-cta{
  background:linear-gradient(120deg,#f6d383,#eeab52);
  border-color:transparent;
  color:#3a2a06;
  box-shadow:0 10px 24px -12px rgba(238,171,82,.55), inset 0 1px 0 rgba(255,255,255,.45);
}
.btn.premium-cta:hover{
  background:linear-gradient(120deg,#f6d383,#eeab52);
  border-color:transparent;
  color:#3a2a06;
  filter:brightness(1.05);
  box-shadow:0 14px 30px -10px rgba(238,171,82,.72), inset 0 1px 0 rgba(255,255,255,.55);
}

.input,.select{
  background:var(--glass-2); border:1px solid var(--glass-border-soft);
  box-shadow:var(--hi);
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.input:focus,.select:focus{ background:var(--glass-solid); box-shadow:var(--hi), 0 0 0 4px rgb(var(--accent)/.12); }
.seg{ background:var(--glass-2); border:1px solid var(--glass-border-soft); }
.seg-th{ background:var(--glass-solid); box-shadow:var(--hi), var(--sh-sm); }
.chip{ background:var(--glass-3); border:1px solid var(--glass-border-soft); }
.kbd{ background:var(--glass-2); border:1px solid var(--glass-border-soft); }
.sw-t{ box-shadow:inset 0 1px 3px rgba(0,0,0,.25); }
.sw-t.on{ box-shadow:inset 0 1px 2px rgba(0,0,0,.18), 0 0 16px -2px rgb(var(--accent)/.6); }
.cbx{ background:var(--glass-2); box-shadow:var(--hi); }
.cbx.on{ box-shadow:0 0 12px -1px rgb(var(--accent)/.6), inset 0 1px 0 rgba(255,255,255,.25); }

/* ---------- 5 · Поверхности: карточки (без blur — их много), модалки/меню (blur — их 0-1 на экране) ---------- */
.card,.stats,.chart,.set-card,.rows,.tk-list,.eq,.wcol,.site-card,.checkout-card,
.eisen .eq,.banner,.meter,.dash-top .stats,.hist .card{
  background:linear-gradient(175deg, var(--glass-1) 0%, color-mix(in srgb, var(--card) 88%, transparent) 100%);
  border:1px solid var(--glass-border-soft);
  box-shadow:var(--glow-lift);
  border-radius:var(--r-l);
}
.tk-list,.rows{ border-radius:var(--r-l); }
.pad{ position:relative; z-index:1; }
.modal{
  background:var(--glass-solid); border:1px solid var(--glass-border);
  box-shadow:var(--glow-lift-lg); backdrop-filter:var(--bf-menu);
  border-radius:var(--r-xl);
}
.settings{
  background:var(--glass-solid); border:1px solid var(--glass-border);
  box-shadow:var(--glow-lift-lg); backdrop-filter:var(--bf-menu);
  border-radius:var(--r-xl);
}
.set-nav{ background:color-mix(in srgb, var(--surface) 60%, transparent); }
.set-nav button.on{ background:var(--glass-2); box-shadow:var(--hi), var(--sh-sm); }
.set-head{ background:transparent; }
.menu{
  background:var(--glass-menu); border:1px solid var(--glass-border);
  box-shadow:var(--glow-lift-lg); backdrop-filter:var(--bf-menu);
  border-radius:var(--r-m);
}
.mi:hover,.mi.hl{ background:var(--glass-2); }
.palette{
  background:var(--glass-menu); border:1px solid var(--glass-border);
  box-shadow:var(--glow-lift-lg); backdrop-filter:var(--bf-menu);
  border-radius:var(--r-xl);
}
.toast{
  background:var(--glass-menu); border:1px solid var(--glass-border);
  box-shadow:var(--glow-lift-lg); backdrop-filter:var(--bf-menu);
}
.tip{ backdrop-filter:var(--bf-menu); -webkit-backdrop-filter:var(--bf-menu); box-shadow:var(--glow-lift-lg); }
.dl-float{
  background:var(--glass-menu); border:1px solid var(--glass-border);
  box-shadow:var(--glow-lift-lg); backdrop-filter:var(--bf-menu);
  border-radius:var(--r-l);
}

/* ---------- 6 · Плитки (сетки виджетов, KPI, ачивки, закладки, расширения) — без blur, их много ---------- */
.kpi,.tk-stat,.profile-stat,.bm,.ext,.cert,.q-tile,.tabs-card,.day,.wg-add,.ach-card,.tcard{
  border-radius:var(--r-m);
  transition:transform .32s var(--ease),border-color .25s,box-shadow .35s,background .3s;
}
.kpi,.tk-stat,.profile-stat{
  background:linear-gradient(160deg, var(--glass-2), color-mix(in srgb, var(--card) 86%, transparent));
  border:1px solid var(--glass-border-soft);
  box-shadow:var(--glow-lift);
}
.bm,.ext,.cert{
  background:linear-gradient(160deg, var(--glass-1), color-mix(in srgb, var(--card) 88%, transparent));
  border:1px solid var(--glass-border-soft);
  box-shadow:var(--glow-lift);
}
.bm:hover,.ext:hover{
  box-shadow:var(--glow-lift), 0 12px 28px -18px rgb(var(--glow-rgb,var(--accent)) / var(--glow-sh-a,.14));
  border-color:color-mix(in srgb, rgb(var(--glow-rgb,var(--accent))) var(--glow-bdr-p,16%), var(--line-2));
}
.q-tile,.tabs-card{
  background:var(--glass-1); border:1px solid var(--glass-border-soft);
  box-shadow:var(--glow-lift);
}
.q-tile:hover,.tabs-card:hover{
  transform:translate3d(0,-2px,0);
  box-shadow:var(--glow-lift), 0 12px 26px -18px rgb(var(--glow-rgb,var(--accent)) / var(--glow-sh-a,.14));
  border-color:color-mix(in srgb, rgb(var(--glow-rgb,var(--accent))) var(--glow-bdr-p,16%), var(--line-2));
}
.q-tile.on,.tabs-row.on{ box-shadow:0 0 0 1.5px rgb(var(--glow-rgb,var(--ga))/.75), var(--glow-lift); }
.q-tile-bar,.tabs-row{ background:var(--glass-2); }
.q-prev{ background:color-mix(in srgb, var(--card-3) 90%, transparent); }
.day{
  background:linear-gradient(165deg, var(--glass-1), color-mix(in srgb, var(--card) 90%, transparent));
  border:1px solid var(--glass-border-soft); box-shadow:var(--glow-lift);
}
.day:hover{
  box-shadow:var(--glow-lift), 0 12px 26px -18px rgb(var(--glow-rgb,var(--accent)) / var(--glow-sh-a,.14));
  border-color:color-mix(in srgb, rgb(var(--glow-rgb,var(--accent))) var(--glow-bdr-p,16%), var(--line-2));
}
.wg-add{ background:var(--glass-1); border-radius:var(--r-l); }
.wg-add:hover{ background:var(--glass-2); }
.ach-card{ border-radius:var(--r-l); }
.ach-card::before{ content:none !important; }
.ach-card:hover{
  box-shadow:var(--hi), 0 12px 28px -20px rgb(var(--glow-rgb,var(--ach-rgb)) / var(--glow-sh-a,.16));
  border-color:color-mix(in srgb, rgb(var(--glow-rgb,var(--ach-rgb))) var(--glow-bdr-p,18%), var(--line-2));
}
.tcard{ box-shadow:var(--hi); }
.tcard:hover{
  box-shadow:var(--hi), 0 12px 26px -18px rgb(var(--glow-rgb,var(--accent)) / var(--glow-sh-a,.14));
  border-color:color-mix(in srgb, rgb(var(--glow-rgb,var(--accent))) var(--glow-bdr-p,16%), var(--line-2));
}
.achievements-section,.profile-hero{ box-shadow:var(--glow-lift); border-radius:var(--r-xl); }
.ach-card,.bm,.ext,.kpi,.tk-stat,.day{ contain:layout style; }
.profile-hero::before,.profile-hero::after{ content:none !important; }
.ach-status-chip,.ach-filter{ background:var(--glass-2); }

/* спотлайт-подсветка курсора на поверхностях: единый цвет --glow-rgb, без задвоения (только на .spot-on) */
.card,.stats,.chart,.set-card,.eq,.wcol,.site-card,.checkout-card,
.kpi,.tk-stat,.profile-stat,.profile-award-slot,.bm,.ext,.cert,.q-tile,.tabs-card,.day,.ach-card,.tcard{
  position:relative; isolation:isolate;
}
.card::after,.stats::after,.chart::after,.set-card::after,.eq::after,.wcol::after,.site-card::after,.checkout-card::after,
.kpi::after,.tk-stat::after,.profile-stat::after,.profile-award-slot::after,.bm::after,.ext::after,.cert::after,.q-tile::after,.tabs-card::after,.day::after,.ach-card::after,.tcard::after{
  content:""; position:absolute; inset:0; border-radius:inherit; z-index:3; pointer-events:none;
  opacity:0; transition:opacity .32s var(--ease);
  background:radial-gradient(230px circle at var(--mx,50%) var(--my,50%), rgb(var(--glow-rgb,var(--ga)) / var(--glow-spot-a,.034)), transparent 68%);
}
.spot-on::after{
  opacity:1;
}
body.glow-off .spot-on::after,body[data-gfx="perf"] .spot-on::after{
  opacity:0 !important;
}

/* ---------- 7 · Списки и строки (без blur — строк может быть много) ---------- */
.lrow,.tk,.hrow,.prot-row,.cbd-row,.vis,.trow,.cert{
  border-radius:var(--r-s);
  transition:background .2s;
}
.lrow:hover,.tk:hover,.hrow:hover,.cbd-row:hover{ background:var(--glass-2); }
.wev{ background:var(--glass-2); }
.wev:hover{ background:var(--glass-3); }
.tbl thead th{ border-bottom:1px solid var(--glass-border-soft); }
.tbl td{ border-top:1px solid var(--glass-border-soft); }
.pbar{ background:var(--glass-3); box-shadow:inset 0 1px 2px rgba(0,0,0,.18); }
.pbar i{ box-shadow:0 0 10px rgb(var(--accent)/.5); }

/* ---------- 8 · Диаграммы ---------- */
.chart{ box-shadow:var(--glow-lift), inset 0 1px 0 rgba(255,255,255,.02); }
.bar i{ box-shadow:0 1px 0 rgba(255,255,255,.06) inset; }
.donut circle.trk{ stroke:var(--glass-border-soft); }
.donut{ filter:drop-shadow(0 6px 18px rgb(var(--accent)/.18)); }

/* ---------- 9 · Мессенджер (blur только на разовых панелях, не на сообщениях) ---------- */
.msg-side{ background:var(--glass-sb); backdrop-filter:var(--bf-glass); }
.msg-main{ background:transparent; }
.me-card{ background:var(--glass-1); border:1px solid var(--glass-border-soft); backdrop-filter:var(--bf-glass); }
.chat-i:hover{ background:var(--glass-2); }
.chat-i.on{ background:var(--glass-2); box-shadow:inset 0 0 0 1px var(--glass-border), var(--hi); }
.bub{ background:var(--glass-2); border:1px solid var(--glass-border-soft); box-shadow:var(--hi); }
.msg-sys{ background:var(--glass-2); }
.composer .box{ background:var(--glass-1); border:1px solid var(--glass-border-soft); backdrop-filter:var(--bf-glass); }

/* ---------- 10 · Переходы страниц (лёгкое появление, без дорогого blur-фильтра) ---------- */
.view.enter{ animation:viewInGlass .42s var(--ease) both; }
@keyframes viewInGlass{
  from{ opacity:0; transform:translate3d(0,10px,0) scale(.988); }
}
.rise{ animation:riseGlass .46s var(--ease) both; animation-delay:calc(var(--i,0) * 35ms); }
@keyframes riseGlass{ from{ opacity:0; transform:translate3d(0,10px,0); } }
html.reduce-motion .view.enter,html.reduce-motion .rise{ animation-duration:.01ms !important; }

/* ---------- 11 · Разное ---------- */
.empty .ei{ background:var(--glass-2); border:1px solid var(--glass-border-soft); }
.file-ic{ box-shadow:0 8px 18px -10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.18); }
.avatar,.av{ box-shadow:0 8px 18px -10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.2); }
.logo{ box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.07),0 10px 22px -10px rgba(0,0,0,.55); }
.send{ box-shadow:0 10px 26px -10px rgb(var(--gc)/.85),inset 0 1px 0 rgba(255,255,255,.32); }



/* =========================================================================
   12 · ПРЕМИАЛЬНЫЙ МИНИМАЛИЗМ — контентный слой (воздух, иерархия, меньше шума)
   Только отступы/типографика/чистка визуального шума — структура и data-*
   хуки, на которые завязан JS, не меняются.
   ========================================================================= */

/* --- Больше воздуха на страницах и адаптив под все виды мониторов --- */
.page,.page.narrow{ width:100%; max-width:none; margin:0; padding:clamp(22px,2.4vw,38px) clamp(22px,2.8vw,44px) 56px; box-sizing:border-box; }
.sitepg{ width:100%; max-width:none; margin:0; padding:clamp(28px,3vw,52px) clamp(24px,3vw,48px) 60px; box-sizing:border-box; }
.page-h{ margin-bottom:26px; align-items:flex-start; }
.page-title{ font-weight:650; letter-spacing:-.03em; }
.page-sub{ opacity:.68; margin-top:8px; }
.page-actions{ gap:10px; }

/* --- Карточки: спокойнее заголовки, больше внутреннего воздуха --- */
.card-h{ margin-bottom:18px; }
.card-h h3{ font-weight:600; letter-spacing:-.01em; }
.card.pad{ padding:22px 24px; }
.stats{ padding:22px 24px 24px; }

/* --- Сетки: больше дыхания между блоками и полный адаптив ---
   НЕ задавать здесь grid-template-columns для .dash-top/.dash-bottom:
   этот блок стоит ПОСЛЕ @media/@container с правилами адаптива
   (строки ~1464/1509) и перебивал бы их: на узких экранах сетка
   «Дашборд» не складывалась в стек и правая карточка обрезалась
   краем окна. */
.dash-top{ gap:20px; }
.dash-right{ gap:20px; }
.dash-bottom{ gap:20px; margin-top:20px; }
.bm-grid{ gap:14px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
.ext-grid{ gap:14px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
.wg-grid{ gap:18px; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); }
.tk-stats{ gap:14px; margin-bottom:18px; }
.profile-stats{ gap:12px; margin:16px 0 28px; }
.ach-grid{ gap:12px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
.cal,.week,.cal-dows{ gap:10px; }
@media (min-width:1800px){
  .bm-grid{ grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; }
  .ext-grid{ grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
  .ach-grid{ grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .wg-grid{ grid-template-columns:repeat(auto-fit,minmax(460px,1fr)); gap:20px; }
}
@media (max-width:720px){
  .page,.page.narrow,.sitepg{ padding:18px 16px 40px; }
}

/* --- Чипы и бейджи: тише, легче, без лишнего веса, без blur (их много) --- */
.chip{ font-weight:550; background:var(--glass-2); border-color:var(--glass-border-soft); }

/* --- Таблицы и списки-строки: убираем жёсткие линии-разделители, отступ вместо границы --- */
.tbl th{ padding-bottom:12px; }
.tbl td{ padding:12px 8px; border-top:1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.prot-row{ padding:13px 2px; border-top:1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.prot-row:first-of-type{ padding-top:6px; }

/* --- KPI-плитки: чуть спокойнее, крупнее число --- */
.kpi{ padding:16px 17px; }
.kpi .kv2 b.num{ letter-spacing:-.02em; }

/* --- Сегменты/переключатели периода: меньше визуального веса в неактивном состоянии --- */
.seg{ background:var(--glass-1); }
.seg button{ font-weight:500; }
.seg button.on{ font-weight:600; }

/* --- Пустые состояния: спокойнее, без лишнего контраста --- */
.empty{ padding:34px 20px; }
.empty b{ font-weight:600; }

/* --- Заголовки card-h с сегментами: выравнивание по базовой линии, меньше скученности --- */
.card-h .seg.sm{ margin-left:auto; }

.tk-bar{ gap:12px; margin-bottom:20px; }

/* --- Активный пункт бокового меню: без цветной полоски-акцента, только мягкая подсветка --- */
.nav-ind::after{ display:none; content:none; }

/* --- Профиль: 3 выровненные карточки в один ряд без растягивания первой карточки --- */
.profile-top{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:18px; align-items:stretch; margin-bottom:20px; }
.profile-id-card{ display:flex; flex-direction:column; justify-content:space-between; gap:18px; padding:22px 24px; }
.profile-id-card .profile-stats{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.profile-id.is-premium .profile-avatar{ box-shadow:0 0 0 2px rgb(238 180 79/.65),0 12px 34px -18px rgb(var(--gc)/.75),inset 0 1px 0 rgba(255,255,255,.32); }
.profile-name-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.profile-user h2{ margin:0; }
.premium-pill{ display:inline-flex; align-items:center; gap:4px; margin:0; padding:3px 9px 3px 7px; border-radius:99px; background:linear-gradient(120deg,#f6d383,#eeab52); color:#3a2a06; font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; flex:none; }
.premium-pill .i{ width:11px; height:11px; }
.profile-premium-card{ display:flex; flex-direction:column; gap:12px; padding:22px 24px; border:1px solid rgb(238 180 79/.22); background:linear-gradient(150deg,rgb(238 180 79/.09),var(--card) 60%); }
.profile-premium-card.is-active{ border-color:rgb(238 180 79/.4); }
.premium-ic{ background:linear-gradient(145deg,rgb(246 200 110/.3),rgb(238 180 79/.14)); color:#eeab52; border-color:rgb(238 180 79/.3); }
.premium-crown{ display:grid; place-items:center; }
.premium-crown .i{ color:#eeab52; }
.premium-feature-list{ display:flex; flex-direction:column; gap:8px; }
.premium-feature-list li{ display:flex; align-items:flex-start; gap:10px; color:var(--text-2); font-size:11.5px; line-height:1.35; }
.premium-feature-list li .i{ width:16px; height:16px; flex:none; margin-top:1px; color:#eeab52; }
.premium-feature-list li div b{ display:block; color:var(--text); font-size:12px; font-weight:600; }
.premium-feature-list li div small{ display:block; margin-top:2px; color:var(--text-3); font-size:10.5px; }
.premium-feature-list.mini li{ gap:8px; }
.premium-feature-list.mini li span{ font-weight:550; }
.premium-active-badge{ display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:10px; background:rgb(var(--ok)/.1); color:rgb(var(--ok)); font-size:11.5px; font-weight:650; }
.premium-active-badge .i{ width:14px; height:14px; }
.profile-premium-card .btn{ margin-top:auto; }
.premium-cta{ background:linear-gradient(120deg,#f6d383,#eeab52); border-color:transparent; color:#3a2a06; }
.premium-cta:hover{ filter:brightness(1.05); }
.premium-plan-toggle{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.premium-plan-opt{ position:relative; display:flex; flex-direction:column; gap:5px; padding:14px; border:1px solid var(--line-2); border-radius:14px; background:var(--card-2); color:var(--text-2); cursor:pointer; text-align:left; transition:border-color .18s,background .18s; }
.premium-plan-opt b{ font-size:12.5px; color:var(--text); }
.premium-plan-opt span{ font:600 15px/1 var(--font-d); color:var(--text); }
.premium-plan-opt span small{ font:500 10.5px/1 var(--font); color:var(--text-3); }
.premium-plan-opt.on{ border-color:#eeab52; background:linear-gradient(150deg,rgb(238 180 79/.14),var(--card-2)); }
.premium-plan-badge{ position:absolute; top:-8px; right:10px; padding:2px 7px; border-radius:99px; background:#eeab52; color:#3a2a06; font-size:9px; font-weight:800; }
.profile-trust{ display:none; }
.profile-id-card .profile-stats{ margin:0; }
.profile-ach-card{ display:flex; flex-direction:column; gap:14px; padding:22px 24px; }
.pac-head{ display:flex; align-items:center; gap:12px; }
.pac-ic{ width:42px; height:42px; display:grid; place-items:center; flex:none; border:1px solid rgb(var(--ga)/.22); border-radius:14px; background:linear-gradient(145deg, rgb(var(--ga)/.16), rgb(var(--gc)/.1)); color:rgb(var(--ga)); }
.pac-ic .i{ width:21px; height:21px; }
.pac-head b{ display:block; font:600 16px/1.15 var(--font-d); color:var(--text); letter-spacing:-.02em; }
.pac-head small{ display:block; margin-top:3px; color:var(--text-3); font-size:10.5px; }
.ach-bar{ display:flex; height:10px; border-radius:99px; overflow:hidden; background:var(--glass-3); box-shadow:inset 0 1px 2px rgba(0,0,0,.2); }
.ach-seg{ width:var(--w,0%); min-width:0; height:100%; border:0; padding:0; cursor:pointer; transition:filter .2s,opacity .2s; opacity:.85; position:relative; }
.ach-seg:hover,.ach-seg.on{ opacity:1; }
.ach-seg[data-status="earned"]{ background:linear-gradient(90deg, rgb(var(--ok)/.9), rgb(var(--ok))); }
.ach-seg[data-status="progress"]{ background:linear-gradient(90deg, rgb(var(--gc)/.85), rgb(var(--gc))); }
